<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드 혜택 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232F;
    --ink-soft:#3C4A54;
    --paper:#EEF1EF;
    --paper-raised:#F8F9F8;
    --line:#D3D9D5;
    --line-soft:#E2E6E3;
    --gold:#A9812F;
    --gold-soft:#EFE4C6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:48px 24px 120px;
  }
  header{
    margin-bottom:36px;
  }
  .eyebrow-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:34px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .count{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .sub{
    font-size:14px;
    color:var(--ink-soft);
    margin:10px 0 0;
    max-width:56ch;
    line-height:1.6;
  }

  .toolbar{
    margin:32px 0 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .search-row{
    display:flex;
    align-items:center;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:10px;
    gap:10px;
  }
  .search-row svg{flex:none;color:var(--ink-soft);}
  .search-row input{
    flex:1;
    border:none;
    background:none;
    outline:none;
    font-family:'Newsreader', serif;
    font-size:22px;
    color:var(--ink);
  }
  .search-row input::placeholder{color:#9AA5A0;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .chip{
    font-size:13px;
    padding:6px 13px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .filters .sep{
    width:1px;
    height:16px;
    background:var(--line);
    margin:0 4px;
  }

  .list{
    margin-top:8px;
  }
  .row{
    border-bottom:1px solid var(--line-soft);
    padding:20px 2px;
    cursor:pointer;
  }
  .row-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .row-title-block{flex:1; min-width:0;}
  .issuer{
    font-size:12px;
    color:var(--gold);
    font-weight:600;
    letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .card-name{
    font-family:'Newsreader', serif;
    font-size:20px;
    font-weight:500;
    color:var(--ink);
  }
  .row-meta{
    text-align:right;
    flex:none;
  }
  .min-spend-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .min-spend{
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .tags{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tag{
    font-size:11.5px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:999px;
  }
  .benefits-preview{
    margin-top:10px;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .benefits-preview b{color:var(--ink); font-weight:500;}

  .detail{
    display:none;
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .row.open .detail{display:block;}
  .row.open .card-name{color:var(--gold);}
  .benefit-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:14px;
  }
  .benefit-item{
    display:flex;
    gap:12px;
    font-size:14px;
    line-height:1.6;
  }
  .benefit-item .b-title{
    flex:none;
    width:110px;
    color:var(--ink);
    font-weight:600;
  }
  .benefit-item .b-desc{color:var(--ink-soft);}
  .memo{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--paper-raised);
    border-left:2px solid var(--gold-soft);
    padding:10px 12px;
    line-height:1.6;
    white-space:pre-wrap;
  }

  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty .em-title{
    font-family:'Newsreader', serif;
    font-size:22px;
    color:var(--ink);
    margin-bottom:8px;
  }

  @media (max-width:560px){
    .wrap{padding:32px 16px 100px;}
    h1{font-size:26px;}
    .row-head{flex-direction:column;}
    .row-meta{text-align:left;}
    .benefit-item{flex-direction:column; gap:2px;}
    .benefit-item .b-title{width:auto;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow-row">
      <h1>카드 혜택 장부</h1>
      <div class="count" id="countLabel">0장 등록</div>
    </div>
    <p class="sub">전월실적 기준과 주요 혜택을 한 곳에 모아두고, 필요할 때 검색해서 바로 확인하세요.</p>
  </header>

  <div class="toolbar">
    <div class="search-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="카드명, 카드사, 혜택 키워드로 검색 (예: 스타벅스, 전월실적 30만원)">
    </div>
    <div class="filters" id="issuerFilters">
      <span class="chip active" data-issuer="__all__">전체</span>
    </div>
  </div>

  <div class="list" id="cardList"></div>
</div>

<script>
/* ============================================================
   여기에 카드 데이터를 직접 입력하세요.
   issuer: 카드사, name: 카드명, minSpend: 전월실적 기준,
   tags: 태그 배열, benefits: [{title, desc}] 혜택 목록, memo: 참고사항
   ============================================================ */
const CARD_DATA = [
  {
    issuer: "예시카드사",
    name: "예시 카드 (이 배열을 수정해서 실제 카드로 교체하세요)",
    minSpend: "300,000원",
    tags: ["샘플", "커피", "대중교통"],
    benefits: [
      { title: "커피전문점", desc: "스타벅스 등 주요 커피전문점 20% 청구할인, 월 최대 5,000원" },
      { title: "대중교통", desc: "버스·지하철 10% 할인, 월 최대 3,000원" }
    ],
    memo: "연회비 15,000원 · 전월실적에서 아파트관리비, 상품권 구매는 제외"
  }
];

let openRowId = null;
let activeIssuer = '__all__';

function uniqueIssuers(){
  return [...new Set(CARD_DATA.map(c=>c.issuer).filter(Boolean))].sort();
}

function renderFilters(){
  const wrap = document.getElementById('issuerFilters');
  const issuers = uniqueIssuers();
  wrap.innerHTML = '';
  const allChip = document.createElement('span');
  allChip.className = 'chip' + (activeIssuer==='__all__' ? ' active' : '');
  allChip.textContent = '전체';
  allChip.onclick = () => { activeIssuer='__all__'; render(); };
  wrap.appendChild(allChip);

  if(issuers.length){
    const sep = document.createElement('span');
    sep.className = 'sep';
    wrap.appendChild(sep);
  }
  issuers.forEach(iss=>{
    const chip = document.createElement('span');
    chip.className = 'chip' + (activeIssuer===iss ? ' active' : '');
    chip.textContent = iss;
    chip.onclick = () => { activeIssuer = (activeIssuer===iss ? '__all__' : iss); render(); };
    wrap.appendChild(chip);
  });
}

function matchesSearch(card, q){
  if(!q) return true;
  const hay = [
    card.issuer, card.name, card.minSpend, card.memo,
    ...(card.tags||[]),
    ...(card.benefits||[]).flatMap(b=>[b.title, b.desc])
  ].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  renderFilters();
  const q = document.getElementById('searchInput').value.trim();
  const listEl = document.getElementById('cardList');
  let filtered = CARD_DATA.filter(c => matchesSearch(c, q) && (activeIssuer==='__all__' || c.issuer===activeIssuer));

  document.getElementById('countLabel').textContent = `${CARD_DATA.length}장 등록`;

  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty">
      <div class="em-title">${CARD_DATA.length===0 ? '등록된 카드가 없습니다' : '조건에 맞는 카드가 없습니다'}</div>
      <div>${CARD_DATA.length===0 ? '스크립트 상단의 CARD_DATA 배열에 카드를 추가해보세요.' : '검색어나 필터를 조정해보세요.'}</div>
    </div>`;
    return;
  }

  listEl.innerHTML = filtered.map((card, idx) => {
    const rowId = String(idx);
    const isOpen = openRowId === rowId;
    const previewText = (card.benefits||[]).slice(0,2).map(b=>`<b>${escapeHtml(b.title)}</b> ${escapeHtml(b.desc)}`).join(' · ');
    return `
    <div class="row ${isOpen?'open':''}" data-toggle="${rowId}">
      <div class="row-head">
        <div class="row-title-block">
          <div class="issuer">${escapeHtml(card.issuer||'')}</div>
          <div class="card-name">${escapeHtml(card.name||'')}</div>
          ${(card.tags&&card.tags.length) ? `<div class="tags">${card.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${!isOpen && previewText ? `<div class="benefits-preview">${previewText}</div>` : ''}
        </div>
        <div class="row-meta">
          <div class="min-spend-label">전월실적</div>
          <div class="min-spend">${escapeHtml(card.minSpend||'-')}</div>
        </div>
      </div>
      <div class="detail">
        <div class="benefit-list">
          ${(card.benefits||[]).map(b=>`
            <div class="benefit-item">
              <div class="b-title">${escapeHtml(b.title)}</div>
              <div class="b-desc">${escapeHtml(b.desc)}</div>
            </div>`).join('') || '<div class="b-desc">등록된 혜택 항목이 없습니다.</div>'}
        </div>
        ${card.memo ? `<div class="memo">${escapeHtml(card.memo)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      openRowId = (openRowId===id) ? null : id;
      render();
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);
render();
</script>
</body>
</html>
