<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주식 현황 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --surface1:#171a20;
    --surface2:#1e232b;
    --border:#2a3038;
    --border-strong:#3a4149;
    --text1:#edf0f3;
    --text2:#9aa4b2;
    --text3:#5f6773;
    --mint:#4ade9a;
    --mint-dim:#1f3a2c;
    --gold:#e8b04b;
    --gold-dim:#3a2f18;
    --blue:#5b9bd5;
    --blue-dim:#1c2c3a;
    --red:#e2635a;
    --red-dim:#3a1e1c;
    --lime:#a3e635;
  }
  body.light-theme{
    --bg:#f6f5f2;
    --surface1:#ffffff;
    --surface2:#eef0f2;
    --border:#e0e3e7;
    --border-strong:#c8ccd2;
    --text1:#1b1f24;
    --text2:#5b6470;
    --text3:#8b93a0;
    --mint:#178a5c;
    --mint-dim:#dff3ea;
    --gold:#a8720f;
    --gold-dim:#faf0da;
    --blue:#2f6fb0;
    --blue-dim:#e5f0fa;
    --red:#c33a2f;
    --red-dim:#fbe7e5;
    --lime:#65a30d;
  }
  *{box-sizing:border-box;touch-action:manipulation;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text1);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .15s, color .15s;
    padding-bottom:60px;
    overflow-x:hidden;
  }
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;font-family:'Roboto',sans-serif;letter-spacing:-0.4px;}
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-size:22px;
    font-weight:500;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--text2);
  }
  .owner-tabs{
    display:flex;
    gap:8px;
    padding:16px 20px 0;
  }
  .owner-tab{
    flex:1;
    text-align:center;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface1);
    color:var(--text2);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .owner-tab.active{
    background:var(--mint-dim);
    border-color:var(--mint);
    color:var(--mint);
  }
  .summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:16px 20px 4px;
  }
  .metric{
    background:var(--surface1);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 14px;
  }
  .metric .label{font-size:12px;color:var(--text2);margin-bottom:6px;}
  .metric .value{font-size:19px;font-weight:500;}
  .metric .value.mint{color:var(--mint);}
  .metric .value.gold{color:var(--gold);}
  .metric .value.redtext{color:var(--red);}
  .redtext{color:var(--red);}
  .bluetext{color:var(--blue);}

  main{padding:20px;}

  .panel-wrap{padding:0 20px;}
  .panel-title{
    font-size:17px;
    font-weight:700;
    color:var(--text1);
    margin:22px 0 4px;
  }
  .panel-caption{font-size:11.5px;color:var(--text3);margin-bottom:10px;}
  .panel-empty{font-size:12.5px;color:var(--text3);padding:16px 0;}

  .div-chart-scroll{overflow-x:auto;padding-bottom:6px;}
  .div-chart{
    display:flex;
    align-items:flex-end;
    gap:18px;
    height:110px;
    min-width:max-content;
    padding:0 2px 2px;
  }
  .div-bar-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:32px;
    flex-shrink:0;
    justify-content:flex-end;
    height:100%;
    cursor:pointer;
  }
  .div-bar-amount{
    font-size:9px;
    color:var(--text1);
    margin-bottom:6px;
    white-space:nowrap;
  }
  .div-bar{
    width:16px;
    background:var(--gold);
    border-radius:3px 3px 0 0;
    min-height:2px;
  }
  .div-bar-label{
    font-size:10px;
    color:var(--text3);
    margin-top:6px;
    white-space:nowrap;
  }
  .div-bar-col.current .div-bar{background:var(--mint);}
  .div-bar-col.current .div-bar-label{color:var(--text1);font-weight:600;}
  .div-bar-col.current .div-bar-amount{color:var(--text1);font-weight:600;}

  .trend-svg-wrap{width:100%;}
  .trend-caption-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text3);
    margin-top:4px;
  }
  .trend-latest{
    font-size:18px;
    font-weight:600;
    color:var(--text1);
    margin-bottom:2px;
  }
  .trend-latest-delta{font-size:12px;margin-bottom:8px;}

  .breakdown-wrap{padding:0 20px;}
  .breakdown-card{
    padding:0;
  }
  .breakdown-title{
    font-size:17px;
    font-weight:700;
    color:var(--text1);
    margin:22px 0 10px;
    cursor:pointer;
  }
  .breakdown-row{
    padding:14px 0;
    border-bottom:1px solid var(--border);
  }
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
  }
  .breakdown-name-block{min-width:0;flex:1;}
  .breakdown-name{font-weight:600;color:var(--text1);font-size:16px;}
  .breakdown-price-line{font-size:11.5px;color:var(--text3);margin-top:3px;}
  .breakdown-price{color:var(--lime);font-weight:600;}
  .price-highlight{color:var(--lime);font-weight:600;}
  .breakdown-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
  .breakdown-ratio{font-size:14px;font-weight:600;color:var(--text1);font-family:'Roboto',sans-serif;}
  .breakdown-pl{font-size:12px;line-height:1.3;font-family:'Roboto',sans-serif;}
  .breakdown-bar-track{
    height:6px;
    background:var(--surface2);
    border-radius:3px;
    overflow:hidden;
  }
  .breakdown-bar-fill{
    height:100%;
    background:var(--mint);
    border-radius:3px;
  }
  .target-toggle{
    font-size:11.5px;
    color:var(--text3);
    cursor:pointer;
    margin-top:8px;
    display:inline-block;
  }
  .target-panel{
    margin-top:10px;
    padding:10px;
    background:var(--surface2);
    border-radius:8px;
  }
  .target-panel .entry-row{border-bottom:none;padding:5px 0;}

  .section-title{
    font-size:17px;
    font-weight:700;
    color:var(--text1);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .add-btn{
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text1);
    border-radius:8px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .add-btn:active{transform:scale(0.97);}

  .account-card{
    margin:0 -20px;
    padding:0;
    border-bottom:1px solid var(--border);
  }
  .account-card:last-child{border-bottom:none;}
  .account-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
    cursor:pointer;
  }
  .account-name{font-size:16px;font-weight:500;color:var(--text1);}
  .account-total{font-size:12px;color:var(--text3);margin-top:3px;}
  .chevron{
    color:var(--text3);
    font-size:12px;
    transition:transform .15s;
  }
  .account-body{
    display:none;
    padding:2px 20px 20px;
  }
  .account-card.open .account-body{display:block;}
  .account-card.open .chevron{transform:rotate(90deg);}

  .stock-row{
    cursor:pointer;
    padding:12px 8px 14px 4px;
  }
  .stock-card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .stock-card-title{flex:1;min-width:0;}
  .stock-card-name{font-size:15px;font-weight:700;color:var(--gold);}
  .stock-card-ticker{font-size:11px;color:var(--text3);font-weight:400;margin-left:4px;}
  .stock-card-qty{font-size:12px;color:var(--text2);text-align:right;flex-shrink:0;white-space:nowrap;}
  .stock-card-qty b{color:var(--text1);font-weight:600;}
  .stock-stat-grid{
    display:flex;
    flex-wrap:wrap;
    gap:7px 16px;
    padding:0 2px;
  }
  .stock-stat{font-size:12.5px;flex:auto;min-width:45%;}
  .stock-stat:nth-child(odd){text-align:left;}
  .stock-stat:nth-child(even){text-align:right;}
  .stock-stat-label{color:var(--text3);margin-right:6px;}
  .stock-stat-value{color:var(--text1);font-weight:500;}
  .stock-stat-value.redtext{color:var(--red);}
  .stock-stat-value.bluetext{color:var(--blue);}
  .stock-stat-value.price-highlight{color:var(--lime);}

  .sub-block{margin-bottom:6px;}
  .holding-card{
    border-top:1px solid var(--border-strong);
    border-bottom:1px solid var(--border-strong);
    padding:12px 0 10px;
    margin-bottom:14px;
  }
  .holding-card .stat-mini{border-bottom:none;}
  .sub-label{
    font-size:12px;
    color:var(--text2);
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .sub-label .tx-section-label{flex:1;min-width:0;}
  .sub-label .mini-add{flex-shrink:0;}
  .entry-row{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    padding:6px 0;
    border-bottom:1px solid var(--border);
    color:var(--text2);
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-row .amt{color:var(--text1);}
  .entry-row .del{
    color:var(--red);
    cursor:pointer;
    margin-left:8px;
    font-size:11px;
  }
  .empty-hint{font-size:12px;color:var(--text3);padding:6px 0;}
  .tx-section-label{cursor:pointer;}

  .stat-hero{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .stat-hero-item{
    flex:1;
    background:var(--surface2);
    border-radius:8px;
    padding:9px 12px;
    min-width:0;
  }
  .stat-hero-label{font-size:10.5px;color:var(--text2);margin-bottom:3px;}
  .stat-hero-value{font-size:16px;font-weight:600;line-height:1.25;color:var(--text1);}
  .stat-hero-value.redtext{color:var(--red);}
  .stat-hero-value.bluetext{color:var(--blue);}
  .stat-mini-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 10px;
    margin-bottom:4px;
  }
  .stat-mini{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:4px 0;
    border-bottom:1px solid var(--border);
    gap:6px;
  }
  .stat-mini-label{font-size:11px;color:var(--text3);}
  .stat-mini-value{font-size:12px;color:var(--text1);font-weight:500;text-align:right;}

  .yield-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin:6px 0 4px;
  }
  .yield-card{
    background:var(--surface2);
    border-radius:8px;
    padding:8px 6px;
    text-align:center;
  }
  .yield-label{font-size:9.5px;color:var(--text3);line-height:1.35;margin-bottom:5px;}
  .yield-value{font-size:14px;font-weight:600;color:var(--gold);}
  .tx-list-scroll{
    max-height:220px;
    overflow-y:auto;
  }

  .mini-add{
    background:none;
    border:1px dashed var(--border-strong);
    color:var(--text2);
    border-radius:7px;
    padding:5px 10px;
    font-size:11.5px;
    cursor:pointer;
  }
  .action-btn-prominent{
    flex:1;
    min-width:110px;
    background:var(--surface2);
    border:1.5px solid var(--mint);
    color:var(--mint);
    border-radius:7px;
    padding:8px 10px;
    font-size:12px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .action-btn-prominent:active{transform:scale(0.98);}
  .inline-num-input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--border-strong);
    color:var(--text1);
    font-size:12.5px;
    text-align:right;
    padding:2px 2px;
    width:72px;
    font-variant-numeric:tabular-nums;
  }
  .inline-num-input:focus{outline:none;border-bottom-color:var(--mint);}

  .form-panel{
    background:var(--surface1);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-top:8px;
    display:none;
  }
  .form-panel.open{display:block;}
  .form-row{
    display:flex;
    gap:14px;
    margin-bottom:12px;
  }
  .form-row .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
    min-width:0;
  }
  .field-label{
    font-size:11px;
    color:var(--text3);
  }
  .form-row input, .form-row select{
    flex:1;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    border-radius:7px;
    padding:0 10px;
    height:42px;
    box-sizing:border-box;
    font-size:16px;
    min-width:0;
    width:100%;
    line-height:42px;
    -webkit-appearance:none;
    appearance:none;
    -moz-appearance:textfield;
  }
  .form-row input[type="number"]::-webkit-outer-spin-button,
  .form-row input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .date-display-wrap{
    position:relative;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    border-radius:7px;
    height:42px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    padding:0 10px;
  }
  .date-display-text{
    font-size:16px;
    color:var(--text3);
    pointer-events:none;
    white-space:nowrap;
  }
  .date-display-text.has-value{color:var(--text1);}
  .date-native-hidden{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    border:none;
    opacity:0;
    cursor:pointer;
  }
  .form-row .field{overflow:hidden;}
  .form-row input::placeholder{color:var(--text3);}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .btn-primary{
    background:var(--mint-dim);
    border:1px solid var(--mint);
    color:var(--mint);
    border-radius:7px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .btn-ghost{
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text2);
    border-radius:7px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text3);
    font-size:13px;
  }
  .json-panel{
    background:var(--surface1);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin:0 20px 16px;
    display:none;
  }
  .json-panel.open{display:block;}
  .json-panel textarea{
    width:100%;
    min-height:220px;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    border-radius:8px;
    padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    line-height:1.5;
    resize:vertical;
  }
  .json-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .json-error{
    color:var(--red);
    font-size:12px;
    margin-top:6px;
    display:none;
  }
  .save-status{
    font-size:11px;
    color:var(--text3);
    padding:4px 20px 0;
  }
  .toast{
    position:fixed;
    bottom:20px;left:50%;
    transform:translateX(-50%);
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:50;
  }
  .toast.show{opacity:1;}

  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:200;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .bottom-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    max-height:75vh;
    display:flex;
    flex-direction:column;
    background:var(--surface1);
    border-radius:16px 16px 0 0;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:201;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,0.3);
  }
  .bottom-sheet.open{transform:translateY(0);}
  .sheet-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-size:15px;
    font-weight:500;
    color:var(--text1);
  }
  .sheet-close-btn{
    background:none;
    border:none;
    color:var(--text2);
    font-size:24px;
    line-height:1;
    padding:0 4px;
    cursor:pointer;
  }
  .sheet-body{
    overflow-y:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .sheet-body::-webkit-scrollbar{display:none;}
  .sheet-body .entry-row{border-bottom:none;}

  .sheet-overlay2{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:210;
  }
  .sheet-overlay2.open{opacity:1;pointer-events:auto;}
  .bottom-sheet2{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    max-height:75vh;
    display:flex;
    flex-direction:column;
    background:var(--surface1);
    border-radius:16px 16px 0 0;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:211;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,0.4);
  }
  .bottom-sheet2.open{transform:translateY(0);}
</style>
</head>
<body>

<header>
  <h1>주식 현황 정리</h1>
  <p>계좌별 보유 종목, 매수·매도, 배당을 기록합니다</p>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
    <button class="add-btn" id="toggleJsonBtn" style="white-space:nowrap;">JSON 보기/편집</button>
    <button class="add-btn" id="reloadJsonBtn" style="white-space:nowrap;">stock.json 새로고침</button>
    <button class="add-btn" id="themeToggleBtn" style="white-space:nowrap;">라이트 모드</button>
  </div>
</header>
<div class="save-status" id="saveStatus">저장된 데이터 불러오는 중...</div>

<div class="json-panel" id="jsonPanel">
  <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">
    stock.json 파일로 내보내서 보관해두세요. 데이터가 사라지면 그 파일을 다시 가져오면 복원됩니다. 아래 텍스트를 직접 고친 뒤 '적용'을 눌러도 됩니다.
  </div>
  <textarea id="jsonTextarea" spellcheck="false"></textarea>
  <div class="json-error" id="jsonError">JSON 형식이 올바르지 않습니다. 콤마, 괄호를 확인해주세요.</div>
  <div class="json-actions">
    <button class="btn-primary" onclick="exportJsonFile()">stock.json 내보내기</button>
    <button class="btn-primary" onclick="triggerImportFile()">stock.json 가져오기</button>
  </div>
  <div class="json-actions">

</div>

<datalist id="stockCatalogNames"></datalist>

<div class="toast" id="toast"></div>

<script>
let DATA = { owners: [], accounts: [], stocks: [] };
let currentOwner = null;
let openAccounts = new Set();
let openStocks = new Set();
let openTxSections = new Set();
let breakdownOpen = false;

const STORAGE_KEY = 'portfolio-data';
const hasWindowStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
let dataSource = null; // 'server-json' | 'window-storage' | 'new'

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function fmtWon(n){ return (n||0).toLocaleString('ko-KR') + '원'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function setSaveStatus(msg){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = msg;
}

function isValidPortfolio(obj){
  return !!(obj && obj.owners && obj.accounts && obj.stocks);
}

async function loadData(){
  // 1순위: 같은 경로의 stock.json (서버에 올린 정적 파일)
  try{
    const res = await fetch('./stock.json', { cache:'no-store' });
    if(res.ok){
      const parsed = await res.json();
      if(isValidPortfolio(parsed)){
        DATA = parsed;
        dataSource = 'server-json';
        const priceUpdateNote = DATA.lastPriceUpdate ? (' · 시세 갱신: ' + DATA.lastPriceUpdate) : '';
        setSaveStatus('./stock.json 불러옴 · ' + new Date().toLocaleTimeString('ko-KR') + priceUpdateNote + ' · 자동저장 안 됨, 변경 후 내보내기 필요');
        currentOwner = DATA.owners.length > 1 ? 'ALL' : (DATA.owners.length ? DATA.owners[0].id : null);
        render();
        return;
      }
    }
  }catch(e){
    // 정적 서버가 아니거나(file:// 등) stock.json이 아직 없는 경우 — 다음 단계로
  }

  // 2순위: window.storage (미리보기 환경 등에서만 존재)
  if(hasWindowStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        DATA = JSON.parse(res.value);
        dataSource = 'window-storage';
        setSaveStatus('마지막 저장 데이터를 불러왔습니다 · ' + new Date().toLocaleTimeString('ko-KR'));
        currentOwner = DATA.owners.length > 1 ? 'ALL' : (DATA.owners.length ? DATA.owners[0].id : null);
        render();
        return;
      }
    }catch(e){ /* 무시하고 아래로 */ }
  }

  // 3순위: 새 데이터
  DATA = defaultData();
  dataSource = 'new';
  setSaveStatus('새 데이터로 시작합니다 · stock.json을 서버에 올리면 자동으로 불러와요');
  currentOwner = DATA.owners.length > 1 ? 'ALL' : (DATA.owners.length ? DATA.owners[0].id : null);
  render();
}

function defaultData(){
  return {
    owners: [
      { id:'me', name:'나' },
      { id:'wife', name:'와이프' }
    ],
    accounts: [],
    stockCatalog: [],
    stocks: [],
    targets: {},
    plannedCash: 0,
    snapshots: [],
    dividends: []
  };
}

function migrateStockCatalog(){
  if(!Array.isArray(DATA.stockCatalog)) DATA.stockCatalog = [];
  (DATA.stocks||[]).forEach(s=>{
    if(s.key) return; // 이미 마이그레이션됨
    const key = makeKeyFrom(s.ticker, s.name);
    let cat = catalogByKey(key);
    if(!cat){
      cat = { key, ticker: s.ticker||'', name: s.name||'(이름없음)', currentPrice: s.currentPrice||0 };
      DATA.stockCatalog.push(cat);
    }
    s.key = key;
    delete s.name;
    delete s.ticker;
    delete s.currentPrice;
  });
}

function ensureDataShape(){
  if(!DATA.targets) DATA.targets = {};
  if(typeof DATA.plannedCash !== 'number') DATA.plannedCash = 0;
  if(!Array.isArray(DATA.snapshots)) DATA.snapshots = [];
  if(!Array.isArray(DATA.dividends)) DATA.dividends = [];
  migrateStockCatalog();
}

async function saveData(){
  if(hasWindowStorage){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), false);
    }catch(e){ /* 무시 */ }
  }
  if(dataSource === 'server-json'){
    setSaveStatus('임시 반영됨 (브라우저 안에서만) · ' + new Date().toLocaleTimeString('ko-KR') + ' · stock.json 내보내서 서버에 다시 올려야 저장돼요');
  } else {
    setSaveStatus('저장됨 · ' + new Date().toLocaleTimeString('ko-KR'));
  }
}

function render(){
  ensureDataShape();
  renderOwnerTabs();
  renderSummary();
  renderDividendCalendar();
  renderAssetTrend();
  renderBreakdown();
  renderAccounts();
  renderCatalogDatalists();
}

function renderCatalogDatalists(){
  const tickerList = document.getElementById('stockCatalogTickers');
  const nameList = document.getElementById('stockCatalogNames');
  if(!tickerList || !nameList) return;
  const cats = DATA.stockCatalog || [];
  tickerList.innerHTML = cats.filter(c=>c.ticker).map(c=>`<option value="${escapeHtml(c.ticker)}">${escapeHtml(c.name)}</option>`).join('');
  nameList.innerHTML = cats.map(c=>`<option value="${escapeHtml(c.name)}"></option>`).join('');
}

function renderOwnerTabs(){
  const el = document.getElementById('ownerTabs');
  el.innerHTML = '';
  if(DATA.owners.length > 1){
    const allBtn = document.createElement('div');
    allBtn.className = 'owner-tab' + (currentOwner==='ALL' ? ' active' : '');
    allBtn.textContent = '합계';
    allBtn.onclick = ()=>{ currentOwner = 'ALL'; render(); };
    el.appendChild(allBtn);
  }
  DATA.owners.forEach(o=>{
    const btn = document.createElement('div');
    btn.className = 'owner-tab' + (o.id===currentOwner ? ' active' : '');
    btn.textContent = o.name;
    btn.onclick = ()=>{ currentOwner = o.id; render(); };
    el.appendChild(btn);
  });
}

function accountsForOwner(ownerId){
  if(ownerId==='ALL') return DATA.accounts;
  return DATA.accounts.filter(a=>a.ownerId===ownerId);
}
function stocksForAccount(accountId){
  return DATA.stocks.filter(s=>s.accountId===accountId);
}
function stocksForOwner(ownerId){
  const accIds = accountsForOwner(ownerId).map(a=>a.id);
  return DATA.stocks.filter(s=>accIds.includes(s.accountId));
}
function catalogByKey(key){
  return (DATA.stockCatalog||[]).find(c=>c.key===key);
}
function catalogFor(stock){
  return catalogByKey(stock.key) || { key: stock.key, name:'(알 수 없는 종목)', ticker:'', currentPrice:0 };
}
function stockName(stock){ return catalogFor(stock).name; }
function stockTicker(stock){ return catalogFor(stock).ticker; }
function makeKeyFrom(ticker, name){
  return (ticker && ticker.trim()) ? ticker.trim().toUpperCase() : ('name:'+name);
}
function getOrCreateCatalog(ticker, name, initialPrice){
  const key = makeKeyFrom(ticker, name);
  if(!DATA.stockCatalog) DATA.stockCatalog = [];
  let cat = catalogByKey(key);
  if(!cat){
    cat = { key, ticker: (ticker||'').trim(), name: name, currentPrice: initialPrice||0 };
    DATA.stockCatalog.push(cat);
    return { cat, isNew: true };
  }
  return { cat, isNew: false };
}
function stockTotal(stock){
  return (stock.quantity || 0) * (catalogFor(stock).currentPrice || 0);
}
function stockCostBasis(stock){
  const buyTotal = (stock.buys||[]).reduce((s,b)=>s+(b.amount||0),0);
  const sellTotal = (stock.sells||[]).reduce((s,b)=>s+(b.amount||0),0);
  return buyTotal - sellTotal;
}
function stockPL(stock){
  return stockTotal(stock) - stockCostBasis(stock);
}
function stockPLPercent(stock){
  const cost = stockCostBasis(stock);
  if(!cost) return null;
  return (stockPL(stock) / cost) * 100;
}
function stockKey(stock){
  return stock.key || makeKeyFrom(stock.ticker, stock.name);
}
function findDividendRecord(key, month){
  return (DATA.dividends||[]).find(d=>d.key===key && d.month===month);
}
// 한 계좌(종목)의 배당을 등록/수정 — 같은 종목의 다른 계좌 perShare도 함께 갱신됨
function upsertDividendAccountEntry(key, month, name, ticker, accountId, quantity, perShare){
  if(!DATA.dividends) DATA.dividends = [];
  let rec = findDividendRecord(key, month);
  if(!rec){
    rec = { id: uid('divrec'), key, name, ticker, month, perShare, accounts: [] };
    DATA.dividends.push(rec);
  } else {
    rec.perShare = perShare;
    rec.accounts.forEach(a=>{ a.amount = a.quantity * perShare; });
  }
  const idx = rec.accounts.findIndex(a=>a.accountId===accountId);
  const amount = quantity * perShare;
  if(idx>=0) rec.accounts[idx] = { accountId, quantity, amount };
  else rec.accounts.push({ accountId, quantity, amount });
  return rec;
}
// 같은 종목의 여러 계좌에 한 번에 등록(일괄 입력)
function upsertDividendGroupBulk(key, month, name, ticker, perShare, stockList){
  if(!DATA.dividends) DATA.dividends = [];
  let rec = findDividendRecord(key, month);
  if(!rec){
    rec = { id: uid('divrec'), key, name, ticker, month, perShare, accounts: [] };
    DATA.dividends.push(rec);
  } else {
    rec.perShare = perShare;
  }
  stockList.forEach(s=>{
    if(s.quantity<=0) return;
    const amount = s.quantity * perShare;
    const idx = rec.accounts.findIndex(a=>a.accountId===s.accountId);
    if(idx>=0) rec.accounts[idx] = { accountId:s.accountId, quantity:s.quantity, amount };
    else rec.accounts.push({ accountId:s.accountId, quantity:s.quantity, amount });
  });
  return rec;
}
function deleteDividendRecord(key, month){
  DATA.dividends = (DATA.dividends||[]).filter(d=>!(d.key===key && d.month===month));
}
function removeAccountFromDividendRecord(key, month, accountId){
  const rec = findDividendRecord(key, month);
  if(!rec) return;
  rec.accounts = rec.accounts.filter(a=>a.accountId!==accountId);
  if(rec.accounts.length===0) deleteDividendRecord(key, month);
}
function recordsForKey(key){
  return (DATA.dividends||[]).filter(d=>d.key===key).sort((a,b)=>b.month.localeCompare(a.month));
}
function recordsForStock(stock){
  const key = stockKey(stock);
  return (DATA.dividends||[])
    .filter(rec=>rec.key===key)
    .map(rec=>{
      const acc = rec.accounts.find(a=>a.accountId===stock.accountId);
      if(!acc) return null;
      return { month:rec.month, perShare:rec.perShare, quantity:acc.quantity, amount:acc.amount };
    })
    .filter(Boolean);
}
function recordsForOwner(ownerId){
  const accIds = accountsForOwner(ownerId).map(a=>a.id);
  return (DATA.dividends||[]).map(rec=>{
    const accounts = rec.accounts.filter(a=>accIds.includes(a.accountId));
    const total = accounts.reduce((s,a)=>s+a.amount,0);
    return { ...rec, accounts, total };
  }).filter(rec=>rec.accounts.length>0);
}
function stockDividendTotal(stock){
  return recordsForStock(stock).reduce((s,r)=>s+(r.amount||0),0);
}
function isWithinLast12Months(monthStr){
  if(!monthStr) return false;
  const parts = monthStr.split('-').map(Number);
  const y = parts[0], m = parts[1];
  if(!y || !m) return false;
  const target = new Date(y, m-1, 1);
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth()-11, 1);
  const upper = new Date(now.getFullYear(), now.getMonth(), 1);
  return target >= cutoff && target <= upper;
}
function stockDividendTTM(stock){
  return recordsForStock(stock).filter(r=>isWithinLast12Months(r.month)).reduce((s,r)=>s+(r.amount||0),0);
}
// 기준1: 지금까지 받은 배당 총액 ÷ 총 투자원금 (누적 실현 수익률, 연환산 아님)
function stockYieldOnPrincipal(stock){
  const cost = stockCostBasis(stock);
  if(!cost) return null;
  return (stockDividendTotal(stock) / cost) * 100;
}
// 기준2: 최근 12개월 배당 ÷ 총 투자원금 (=평균매입단가×수량) — 지금 페이스가 앞으로도 이어진다면의 수익률
function stockYieldOnAvgPrice(stock){
  const cost = stockCostBasis(stock);
  if(!cost) return null;
  return (stockDividendTTM(stock) / cost) * 100;
}
// 기준3: 최근 12개월 배당 ÷ 현재 평가금액 — 지금 이 가격에 새로 산다면의 수익률(시장 비교용)
function stockYieldOnCurrentPrice(stock){
  const mv = stockTotal(stock);
  if(!mv) return null;
  return (stockDividendTTM(stock) / mv) * 100;
}
function ownerAvgYield(ownerId, fn){
  const yields = stocksForOwner(ownerId).map(fn).filter(y=>y!==null);
  if(yields.length===0) return null;
  return yields.reduce((a,b)=>a+b,0) / yields.length;
}
function accountTotal(accountId){
  return stocksForAccount(accountId).reduce((sum,s)=>sum+stockTotal(s),0);
}
function accountCostBasis(accountId){
  return stocksForAccount(accountId).reduce((sum,s)=>sum+stockCostBasis(s),0);
}
function ownerTotal(ownerId){
  return accountsForOwner(ownerId).reduce((sum,a)=>sum+accountTotal(a.id),0);
}
function ownerCostBasis(ownerId){
  return accountsForOwner(ownerId).reduce((sum,a)=>sum+accountCostBasis(a.id),0);
}
function fmtPL(n){
  const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
  return sign + Math.abs(n).toLocaleString('ko-KR') + '원';
}
function fmtPercent(n){
  if(n===null) return '';
  const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
  return sign + Math.abs(n).toFixed(2) + '%';
}
function fmtPctPlain(n){
  if(n===null) return '-';
  return n.toFixed(2) + '%';
}
function plClass(n){
  return n > 0 ? 'redtext' : (n < 0 ? 'bluetext' : '');
}
function currentMonthDividend(ownerId){
  const ym = new Date().toISOString().slice(0,7);
  return recordsForOwner(ownerId).filter(r=>r.month===ym).reduce((s,r)=>s+r.total,0);
}
function yearDividend(ownerId){
  const year = new Date().getFullYear().toString();
  return recordsForOwner(ownerId).filter(r=>(r.month||'').startsWith(year)).reduce((s,r)=>s+r.total,0);
}

function renderSummary(){
  const el = document.getElementById('summary');
  const total = ownerTotal(currentOwner);
  const cost = ownerCostBasis(currentOwner);
  const pl = total - cost;
  const plPct = cost ? (pl/cost)*100 : null;
  const monthDiv = currentMonthDividend(currentOwner);
  const yearDiv = yearDividend(currentOwner);
  const avgYield1 = ownerAvgYield(currentOwner, stockYieldOnPrincipal);
  const avgYield2 = ownerAvgYield(currentOwner, stockYieldOnAvgPrice);
  const avgYield3 = ownerAvgYield(currentOwner, stockYieldOnCurrentPrice);
  el.innerHTML = `
    <div class="metric">
      <div class="label">총 평가금액</div>
      <div class="value mint num">${fmtWon(total)}</div>
    </div>
    <div class="metric">
      <div class="label">평가손익</div>
      <div class="value ${plClass(pl)} num" style="font-size:19px;">${fmtPL(pl)}${plPct!==null ? '<div style="font-size:13px;font-weight:400;margin-top:2px;">('+fmtPercent(plPct)+')</div>' : ''}</div>
    </div>
    <div class="metric">
      <div class="label">총 투자원금</div>
      <div class="value num">${fmtWon(cost)}</div>
    </div>
    <div class="metric">
      <div class="label">보유 계좌 수</div>
      <div class="value num">${accountsForOwner(currentOwner).length}개</div>
    </div>
    <div class="metric">
      <div class="label">이번 달 배당</div>
      <div class="value gold num">${fmtWon(monthDiv)}</div>
    </div>
    <div class="metric">
      <div class="label">올해 누적 배당</div>
      <div class="value gold num">${fmtWon(yearDiv)}</div>
    </div>
    <div class="metric" style="grid-column:1 / -1;">
      <div class="label" style="margin-bottom:8px;">종목별 배당률 평균 (3가지 기준)</div>
      <div class="yield-grid">
        <div class="yield-card">
          <div class="yield-label">누적<br>총투자원금 기준</div>
          <div class="yield-value num">${fmtPctPlain(avgYield1)}</div>
        </div>
        <div class="yield-card">
          <div class="yield-label">최근 12개월<br>평균매입가 기준</div>
          <div class="yield-value num">${fmtPctPlain(avgYield2)}</div>
        </div>
        <div class="yield-card">
          <div class="yield-label">최근 12개월<br>현재가 기준</div>
          <div class="yield-value num">${fmtPctPlain(avgYield3)}</div>
        </div>
      </div>
    </div>
  `;
}

// ===== 월별 배당 캘린더 =====
function monthlyDividendSeries(ownerId, monthsBack){
  const now = new Date();
  const series = [];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    series.push({ month: ym, label: (d.getMonth()+1)+'월', amount: 0, isCurrent: i===0 });
  }
  const map = {};
  series.forEach(s=> map[s.month]=s);
  recordsForOwner(ownerId).forEach(rec=>{
    if(map[rec.month]) map[rec.month].amount += rec.total;
  });
  return series;
}

function renderDividendCalendar(){
  const el = document.getElementById('dividendCalendarSection');
  const series = monthlyDividendSeries(currentOwner, 12);
  const total = series.reduce((s,m)=>s+m.amount,0);
  const maxAmt = Math.max(...series.map(m=>m.amount), 1);

  if(total===0){
    el.innerHTML = `
      <div class="panel-wrap">
        <div class="panel-title">월별 배당 현황 (최근 12개월)</div>
        <div class="panel-empty">아직 기록된 배당이 없어요. 종목 상세에서 배당을 추가하면 여기 그래프로 나타나요.</div>
      </div>
    `;
    return;
  }

  const bars = series.map(m=>{
    const barPx = m.amount>0 ? Math.max(4, Math.round((m.amount/maxAmt)*90)) : 2;
    return `
      <div class="div-bar-col${m.isCurrent ? ' current' : ''}" onclick="openMonthDividendSheet('${m.month}')">
        <div class="div-bar-amount num">${m.amount>0 ? m.amount.toLocaleString('ko-KR') : ''}</div>
        <div class="div-bar" style="height:${barPx}px;"></div>
        <div class="div-bar-label">${m.label}</div>
      </div>
    `;
  }).join('');

  el.innerHTML = `
    <div class="panel-wrap">
      <div class="panel-title">월별 배당 현황 (최근 12개월)</div>
      <div class="panel-caption">12개월 합계 ${fmtWon(total)}</div>
      <div class="div-chart-scroll" id="divChartScroll">
        <div class="div-chart">${bars}</div>
      </div>
    </div>
  `;
  const scrollEl = document.getElementById('divChartScroll');
  if(scrollEl) scrollEl.scrollLeft = scrollEl.scrollWidth;
}

// ===== 자산 추이(스냅샷) =====
function upsertSnapshot(){
  ensureDataShape();
  const today = new Date().toISOString().slice(0,10);
  const totals = {};
  DATA.owners.forEach(o=>{ totals[o.id] = ownerTotal(o.id); });
  totals['ALL'] = ownerTotal('ALL');
  const idx = DATA.snapshots.findIndex(s=>s.date===today);
  if(idx>=0) DATA.snapshots[idx] = { date: today, totals };
  else DATA.snapshots.push({ date: today, totals });
  DATA.snapshots.sort((a,b)=>a.date.localeCompare(b.date));
}

function renderAssetTrend(){
  const el = document.getElementById('assetTrendSection');
  const snaps = (DATA.snapshots||[]).filter(s=> typeof s.totals[currentOwner] === 'number');

  const saveBtnHtml = `<button class="add-btn" onclick="saveSnapshotNow()">오늘 스냅샷 저장</button>`;

  if(snaps.length < 2){
    el.innerHTML = `
      <div class="panel-wrap">
        <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>자산 추이</span>
          ${saveBtnHtml}
        </div>
        <div class="panel-empty">스냅샷을 2번 이상 저장하면(예: 매주 한 번씩) 여기에 자산 변화 그래프가 나타나요. 현재가를 업데이트한 날 눌러두시면 좋아요.</div>
      </div>
    `;
    return;
  }

  const values = snaps.map(s=>s.totals[currentOwner]);
  const dates = snaps.map(s=>s.date);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = (max - min) || 1;
  const w = 600, h = 140, pad = 8;

  const points = values.map((v,i)=>{
    const x = pad + (values.length===1 ? 0 : (i/(values.length-1))*(w-2*pad));
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return {x, y};
  });
  const polyPoints = points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPoints = `${pad},${h-pad} ${polyPoints} ${w-pad},${h-pad}`;

  const first = values[0];
  const last = values[values.length-1];
  const delta = last - first;
  const deltaPct = first ? (delta/first)*100 : null;

  el.innerHTML = `
    <div class="panel-wrap">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>자산 추이</span>
        ${saveBtnHtml}
      </div>
      <div class="trend-latest num">${fmtWon(last)}</div>
      <div class="trend-latest-delta num ${plClass(delta)}">${fmtPL(delta)}${deltaPct!==null ? ' ('+fmtPercent(deltaPct)+')' : ''} · 첫 기록 대비</div>
      <div class="trend-svg-wrap">
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
          <polygon points="${areaPoints}" fill="var(--mint-dim)" opacity="0.6"></polygon>
          <polyline points="${polyPoints}" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
        </svg>
      </div>
      <div class="trend-caption-row">
        <span>${dates[0]}</span>
        <span>${dates[dates.length-1]}</span>
      </div>
      <div class="panel-caption" style="margin-top:6px;">스냅샷 ${snaps.length}개 기록됨</div>
    </div>
  `;
}


function allItemsBreakdown(){
  const map = {};
  DATA.stocks.forEach(s=>{
    const key = s.key;
    if(!map[key]){
      const cat = catalogFor(s);
      map[key] = { key, name: cat.name, ticker: cat.ticker||'', value:0, cost:0, count:0, quantity:0 };
    }
    map[key].value += stockTotal(s);
    map[key].cost += stockCostBasis(s);
    map[key].count += 1;
    map[key].quantity += (s.quantity||0);
  });
  return Object.values(map);
}

function stocksMatchingKey(key){
  return DATA.stocks.filter(s=>s.key===key);
}

function safeId(str){
  return str.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function renderBreakdown(){
  const el = document.getElementById('breakdownSection');
  const items = allItemsBreakdown();
  const grandTotal = items.reduce((s,i)=>s+i.value,0);

  if(items.length===0){
    el.innerHTML = '';
    return;
  }

  const sorted = [...items].sort((a,b)=> b.value - a.value);

  const targetSum = sorted.reduce((s,item)=>{
    const t = DATA.targets[item.key];
    return s + (typeof t === 'number' ? t : 0);
  }, 0);

  const plannedCash = DATA.plannedCash || 0;
  const projectedTotal = grandTotal + plannedCash;

  const rows = sorted.map(item=>{
    const pl = item.value - item.cost;
    const plPct = item.cost ? (pl/item.cost)*100 : null;
    const ratio = grandTotal ? (item.value/grandTotal)*100 : 0;
    const sid = safeId(item.key);
    const keyEsc = item.key.replace(/'/g,"\\'");
    const target = DATA.targets[item.key];
    const hasTarget = typeof target === 'number' && !isNaN(target);

    const cat = catalogByKey(item.key);
    const currentPrice = cat ? (cat.currentPrice||0) : 0;

    return `
      <div class="breakdown-row" style="cursor:pointer;" onclick="openTargetSheet('${keyEsc}','${sid}')">
        <div class="breakdown-top">
          <div class="breakdown-name-block">
            <div class="breakdown-name">${escapeHtml(item.name)}${item.ticker ? ' <span style="color:var(--text3);font-weight:400;">('+escapeHtml(item.ticker)+')</span>' : ''}</div>
            <div class="breakdown-price-line">현재가 <span class="breakdown-price">${currentPrice.toLocaleString('ko-KR')}원</span>${item.count>1 ? ' <span style="color:var(--text3);">· '+item.count+'개 계좌</span>' : ''} <span style="color:var(--text3);">· 총 ${item.quantity.toLocaleString('ko-KR')}주</span></div>
          </div>
          <div class="breakdown-right">
            <span class="breakdown-ratio num">${ratio.toFixed(2)}%</span>
            <div class="breakdown-pl num ${plClass(pl)}">${fmtPL(pl)}${plPct!==null ? ' ('+fmtPercent(plPct)+')' : ''}</div>
          </div>
        </div>
        <div class="breakdown-bar-track">
          <div class="breakdown-bar-fill" style="width:${ratio}%;"></div>
        </div>
        <div>
          <span class="target-toggle">목표/배당 관리${hasTarget ? ' · 목표 <span style="color:var(--text1);">'+target+'%</span>' : ''}</span>
        </div>
      </div>
    `;
  }).join('');

  const targetSumHint = targetSum > 0
    ? `<div style="font-size:11.5px;color:var(--text3);padding:2px 4px 2px;">입력된 목표비율 합계: ${targetSum.toFixed(2)}%${Math.abs(targetSum-100) > 0.01 ? ' (100%가 되도록 맞추면 더 정확해요)' : ' ✓'}</div>`
    : '';

  const plannedCashBlock = `
    <div style="padding:10px 4px 14px;border-bottom:1px solid var(--border);margin-bottom:4px;">
      <div class="form-row" style="margin-bottom:0;">
        <div class="field">
          <span class="field-label">앞으로 추가 투입할 금액 (전체)</span>
          <input type="number" inputmode="decimal" placeholder="예: 1000000" value="${plannedCash || ''}" onchange="updatePlannedCash(this.value)">
        </div>
      </div>
      <div style="font-size:11.5px;color:var(--text3);margin-top:6px;">
        현재 총 평가금액 ${fmtWon(grandTotal)} + 투입예정 ${fmtWon(plannedCash)} = 투입 후 총액 ${fmtWon(projectedTotal)} 기준으로 목표금액을 계산해요
      </div>
    </div>
  `;

  el.innerHTML = `
    <div class="breakdown-wrap">
      <div class="breakdown-title" id="breakdownToggle">전체 포트폴리오 비중 (나+와이프 모든 계좌 통합) · ${items.length}개 종목</div>
      ${breakdownOpen ? `<div class="breakdown-card">${plannedCashBlock}${rows}</div>${targetSumHint}` : ''}
    </div>
  `;
  document.getElementById('breakdownToggle').onclick = ()=>{
    breakdownOpen = !breakdownOpen;
    renderBreakdown();
  };
}

function dividendTotalForKey(key){
  return recordsForKey(key).reduce((s,r)=>s+r.accounts.reduce((s2,a)=>s2+a.amount,0),0);
}
function dividendTTMForKey(key){
  return recordsForKey(key).filter(r=>isWithinLast12Months(r.month)).reduce((s,r)=>s+r.accounts.reduce((s2,a)=>s2+a.amount,0),0);
}
function dividendListHtmlForKey(key){
  const records = recordsForKey(key);
  if(records.length===0) return `<div class="empty-hint">기록 없음</div>`;
  return records.map((rec, idx)=>{
    const gid = `keydivacc_${safeId(key)}_${idx}`;
    const total = rec.accounts.reduce((s,a)=>s+a.amount,0);
    const totalQty = rec.accounts.reduce((s,a)=>s+(a.quantity||0),0);
    const keyEsc = key.replace(/'/g,"\\'");
    const accountRows = rec.accounts.map(a=>{
      const acc = DATA.accounts.find(x=>x.id===a.accountId);
      const owner = acc ? DATA.owners.find(o=>o.id===acc.ownerId) : null;
      return `
        <div class="entry-row" style="padding-left:10px;font-size:11px;">
          <span>${acc ? escapeHtml(acc.name) : '(알 수 없는 계좌)'}${owner ? ' · '+escapeHtml(owner.name) : ''} · ${(a.quantity||0).toLocaleString('ko-KR')}주</span>
          <span class="amt num">${fmtWon(a.amount)}</span>
        </div>
      `;
    }).join('');
    return `
      <div style="margin-bottom:6px;">
        <div style="cursor:pointer;" onclick="toggleInlineAccordion('${gid}')">
          <div class="entry-row" style="border-bottom:none;padding-bottom:2px;">
            <span>${rec.month}</span>
            <span><span class="amt num">${fmtWon(total)}</span><span class="del" onclick="event.stopPropagation();deleteKeyDividendRecord('${keyEsc}','${rec.month}')">삭제</span></span>
          </div>
          <div class="entry-row" style="font-size:11px;color:var(--text3);padding-top:0;">
            <span>총 ${totalQty.toLocaleString('ko-KR')}주 · 주당 ${(rec.perShare||0).toLocaleString('ko-KR')}원</span><span></span>
          </div>
        </div>
        <div id="${gid}" style="display:none;">${accountRows}</div>
      </div>
    `;
  }).join('');
}

let openTargetSheetLayer = { key: null, layer: null };

async function deleteKeyDividendRecord(key, month){
  deleteDividendRecord(key, month);
  await saveData();
  render();
  if(openTargetSheetLayer.key === key){
    refreshOpenTargetSheet();
  }

function refreshOpenTargetSheet(){
  const { key, layer } = openTargetSheetLayer;
  if(!key) return;
  const sid = safeId(key);
  if(layer===1 && document.getElementById('bottomSheet').classList.contains('open')){
    openTargetSheet(key, sid);
  } else if(layer===2 && document.getElementById('bottomSheet2').classList.contains('open')){
    openTargetSheetNested(key, sid);
  }
}

function buildTargetSheetContent(key, sid){
  const items = allItemsBreakdown();
  const grandTotal = items.reduce((s,i)=>s+i.value,0);
  const plannedCash = DATA.plannedCash || 0;
  const projectedTotal = grandTotal + plannedCash;
  const item = items.find(i=>i.key===key);
  if(!item) return;

  const ratio = grandTotal ? (item.value/grandTotal)*100 : 0;
  const target = DATA.targets[key];
  const hasTarget = typeof target === 'number' && !isNaN(target);
  const keyEsc = key.replace(/'/g,"\\'");

  let rebalanceHtml = `<div class="entry-row"><span>목표비율</span><span class="amt num">미설정 (JSON의 targets에서 설정)</span></div>`;
  if(hasTarget){
    const targetValue = projectedTotal * (target/100);
    const diff = targetValue - item.value;
    const avgPrice = item.quantity>0 ? (item.value/item.quantity) : null;
    const diffShares = avgPrice ? (diff/avgPrice) : null;
    const actionLabel = diff >= 0 ? '추가 매수 필요' : '이미 목표 초과(매도 검토)';
    rebalanceHtml = `
      <div class="entry-row"><span>목표비율 · 현재 ${ratio.toFixed(2)}%</span><span class="amt num">${target}%</span></div>
      <div class="entry-row"><span>목표 금액 (투입 후 기준)</span><span class="amt num">${fmtWon(targetValue)}</span></div>
      <div class="entry-row"><span>${actionLabel}</span><span class="amt num">${fmtWon(Math.abs(diff))}${diffShares!==null ? ' · 약 '+Math.round(Math.abs(diffShares)).toLocaleString('ko-KR')+'주' : ' (현재가 정보 없음)'}</span></div>
    `;
  }

  const divTotal = dividendTotalForKey(key);
  const divTTM = dividendTTMForKey(key);
  const y1 = item.cost ? (divTotal/item.cost)*100 : null;
  const y2 = item.cost ? (divTTM/item.cost)*100 : null;
  const y3 = item.value ? (divTTM/item.value)*100 : null;

  const bodyHtml = `
    ${rebalanceHtml}
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="action-btn-prominent" onclick="openGroupPriceForm('${keyEsc}','${sid}')">현재가 일괄수정</button>
      <button class="action-btn-prominent" onclick="openGroupDividendForm('${keyEsc}','${sid}')">배당 일괄 입력</button>
    </div>
    <div class="form-panel" id="grpform_${sid}">
      <div class="form-row">
        <div class="field">
          <span class="field-label">새 현재가 (1주당)</span>
          <input type="number" inputmode="decimal" placeholder="예: 25000" id="grpprice_${sid}">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" onclick="closeForm('grpform_${sid}')">취소</button>
        <button class="btn-primary" onclick="applyGroupPrice('${keyEsc}','${sid}')">전체 계좌에 반영</button>
      </div>
    </div>
    <div class="form-panel" id="divgrpform_${sid}">
      <div class="form-row">
        <div class="field">
          <span class="field-label">배당월</span>
          <div class="date-display-wrap">
            <span class="date-display-text" id="divgrp_month_${sid}_display" data-placeholder="월 선택">월 선택</span>
            <input type="month" id="divgrp_month_${sid}" class="date-native-hidden" onchange="syncDateDisplay(this)">
          </div>
        </div>
        <div class="field">
          <span class="field-label">1주당 배당금</span>
          <input type="number" inputmode="decimal" placeholder="예: 500" id="divgrp_amount_${sid}">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" onclick="closeForm('divgrpform_${sid}')">취소</button>
        <button class="btn-primary" onclick="applyGroupDividend('${keyEsc}','${sid}')">전체 계좌에 반영</button>
      </div>
    </div>

    <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border);">
      <div class="panel-title" style="font-size:14px;margin:0 0 8px;">배당 현황</div>
      <div class="yield-grid">
        <div class="yield-card">
          <div class="yield-label">누적<br>총투자원금 기준</div>
          <div class="yield-value num">${fmtPctPlain(y1)}</div>
        </div>
        <div class="yield-card">
          <div class="yield-label">최근 12개월<br>평균매입가 기준</div>
          <div class="yield-value num">${fmtPctPlain(y2)}</div>
        </div>
        <div class="yield-card">
          <div class="yield-label">최근 12개월<br>현재가 기준</div>
          <div class="yield-value num">${fmtPctPlain(y3)}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin:6px 0 10px;">누적 배당 ${fmtWon(divTotal)} · 최근 12개월 ${fmtWon(divTTM)}</div>

    </div>
  `;
  return { title: `${escapeHtml(item.name)} · 목표/배당 관리`, bodyHtml };
}

function openTargetSheet(key, sid){
  const content = buildTargetSheetContent(key, sid);
  if(!content) return;
  openTargetSheetLayer = { key, layer: 1 };
  openSheet(content.title, content.bodyHtml);
}

function openTargetSheetNested(key, sid){
  const content = buildTargetSheetContent(key, sid);
  if(!content) return;
  openTargetSheetLayer = { key, layer: 2 };
  openSheet2(content.title, content.bodyHtml);
}

async function updatePlannedCash(value){
  const num = parseFloat(value);
  DATA.plannedCash = (value==='' || isNaN(num)) ? 0 : num;
  await saveData();
  render();
}

async function applyGroupPrice(key, sid){
  const input = document.getElementById(`grpprice_${sid}`);
  const num = parseFloat(input.value);
  if(isNaN(num)){ showToast('숫자를 입력해주세요'); return; }
  const cat = catalogByKey(key);
  if(!cat){ showToast('종목 정보를 찾을 수 없어요'); return; }
  cat.currentPrice = num;
  const count = stocksMatchingKey(key).length;
  closeForm(`grpform_${sid}`);
  await saveData();
  render();
  refreshOpenTargetSheet();
  showToast(`현재가를 반영했어요 (${count}개 계좌에 자동 적용)`);
}

function openGroupPriceForm(key, sid){

function openGroupDividendForm(key, sid){

async function applyGroupDividend(key, sid){
  const month = document.getElementById(`divgrp_month_${sid}`).value;
  const perShare = parseFloat(document.getElementById(`divgrp_amount_${sid}`).value) || 0;
  if(!month){ showToast('배당월을 선택해주세요'); return; }
  if(!perShare){ showToast('1주당 배당금을 입력해주세요'); return; }
  const cat = catalogByKey(key);
  const stockList = stocksMatchingKey(key).map(s=>({ accountId:s.accountId, quantity:s.quantity||0 }));
  const rec = upsertDividendGroupBulk(key, month, cat ? cat.name : '', cat ? cat.ticker : '', perShare, stockList);
  const total = rec.accounts.reduce((s,a)=>s+a.amount,0);
  closeForm(`divgrpform_${sid}`);
  await saveData();
  render();
  refreshOpenTargetSheet();
  showToast(`${rec.accounts.length}개 계좌에 총 ${total.toLocaleString('ko-KR')}원 반영했어요`);
}

function renderAccounts(){
  const list = document.getElementById('accountList');
  const isAll = currentOwner === 'ALL';
  document.getElementById('addAccountBtn').style.display = isAll ? 'none' : '';
  document.getElementById('accountsLabel').textContent = isAll ? '전체 계좌 (나+와이프)' : '계좌';
  if(isAll) closeForm('accountForm');
  const accounts = accountsForOwner(currentOwner);
  if(accounts.length===0){
    list.innerHTML = `<div class="empty-state">아직 등록된 계좌가 없습니다.<br>위 '계좌 추가' 버튼으로 시작해보세요.</div>`;
    return;
  }
  list.innerHTML = '';
  accounts.forEach(acc=>{
    const isOpen = openAccounts.has(acc.id);
    const ownerName = isAll ? (DATA.owners.find(o=>o.id===acc.ownerId)||{}).name : null;
    const accTotal = accountTotal(acc.id);
    const accCost = accountCostBasis(acc.id);
    const accPL = accTotal - accCost;
    const accPLPct = accCost ? (accPL/accCost)*100 : null;
    const card = document.createElement('div');
    card.className = 'account-card' + (isOpen ? ' open':'');
    card.id = `acccard_${acc.id}`;
    card.innerHTML = `
      <div class="account-head" data-acc="${acc.id}">
        <div>
          <div class="account-name">${escapeHtml(acc.name)}${ownerName ? ' <span style="color:var(--text3);font-weight:400;font-size:12px;">· '+escapeHtml(ownerName)+'</span>' : ''}</div>
          <div class="account-total num">${fmtWon(accTotal)}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div class="num" style="font-size:17px;font-weight:500;color:var(--text1);">${Math.abs(accPL).toLocaleString('ko-KR')}원</div>
          ${accPLPct!==null ? '<div class="num '+plClass(accPL)+'" style="font-size:14px;">('+fmtPercent(accPLPct)+')</div>' : ''}
        </div>
      </div>
      <div class="account-body" id="body_${acc.id}"></div>
    `;
    card.querySelector('.account-head').onclick = ()=>{
      const willOpen = !openAccounts.has(acc.id);
      if(openAccounts.has(acc.id)) openAccounts.delete(acc.id);
      else openAccounts.add(acc.id);
      render();
      if(willOpen) scrollToId(`acccard_${acc.id}`);
    };
    list.appendChild(card);
    if(isOpen){
      renderAccountBody(acc, card.querySelector('.account-body'));
    }
  });
}

function openStockPickerSheet(accountId){
  const cats = [...(DATA.stockCatalog||[])].sort((a,b)=>a.name.localeCompare(b.name));
  const rows = cats.map(c=>{
    const keyEsc = c.key.replace(/'/g,"\\'");
    return `
      <div class="entry-row" style="cursor:pointer;" onclick="addHoldingFromCatalog('${accountId}','${keyEsc}')">
        <span>${escapeHtml(c.name)}${c.ticker ? ' <span style="color:var(--text3);">('+escapeHtml(c.ticker)+')</span>' : ''}</span>
        <span class="amt num">${(c.currentPrice||0).toLocaleString('ko-KR')}원</span>
      </div>
    `;
  }).join('');

  const bodyHtml = `
    ${cats.length ? rows : '<div class="empty-hint">아직 등록된 종목이 없어요. 아래에서 새로 등록해보세요.</div>'}
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
      <div class="panel-caption" style="margin:0 0 8px;">목록에 없는 종목이면 새로 등록하세요 (현재가·수량·매수내역은 등록 후에 채우면 돼요)</div>
      <div class="form-row">
        <input type="text" placeholder="종목명 (예: 뱅가드 S&P500)" id="newcat_name_${accountId}" list="stockCatalogNames">
        <input type="text" placeholder="티커 (선택)" id="newcat_ticker_${accountId}" list="stockCatalogTickers">
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="createCatalogAndAdd('${accountId}')">새 종목으로 추가</button>
      </div>
    </div>
  `;
  openSheet('종목 선택', bodyHtml);
}

async function addHoldingFromCatalog(accountId, key){
  const cat = catalogByKey(key);
  if(!cat) return;
  const newStock = { id: uid('stk'), accountId, key, quantity:0, buys:[], sells:[] };
  DATA.stocks.push(newStock);
  await saveData();
  closeSheet();
  render();
  showToast(`${cat.name} 추가됨 · 매수 내역을 등록해주세요`);
  setTimeout(()=>openStockDetailSheet(newStock.id), 300);
}

async function createCatalogAndAdd(accountId){
  const name = document.getElementById(`newcat_name_${accountId}`).value.trim();
  const ticker = document.getElementById(`newcat_ticker_${accountId}`).value.trim();
  if(!name){ showToast('종목명을 입력해주세요'); return; }
  const { cat } = getOrCreateCatalog(ticker, name, 0);
  const newStock = { id: uid('stk'), accountId, key: cat.key, quantity:0, buys:[], sells:[] };
  DATA.stocks.push(newStock);
  await saveData();
  closeSheet();
  render();
  showToast(`${cat.name} 새로 등록됨 · 현재가와 매수 내역을 등록해주세요`);
  setTimeout(()=>openStockDetailSheet(newStock.id), 300);
}

function stockEmoji(name, ticker){
  const n = (name||'') + ' ' + (ticker||'');
  const rules = [
    [/반도체|semiconductor/i, '💾'],
    [/나스닥|nasdaq/i, '📈'],
    [/s&?p\s?500|에스앤피/i, '🇺🇸'],
    [/리츠|reit/i, '🏢'],
    [/금|gold/i, '🥇'],
    [/은(?!행)|silver/i, '🥈'],
    [/원유|oil|에너지|energy/i, '🛢️'],
    [/배당|dividend/i, '💰'],
    [/테슬라|tesla/i, '🚗'],
    [/애플|apple/i, '🍎'],
    [/차이나|중국|china/i, '🇨🇳'],
    [/일본|japan/i, '🇯🇵'],
    [/인도|india/i, '🇮🇳'],
    [/코스피|kospi|코스닥|국내/i, '🇰🇷'],
    [/채권|bond/i, '📜'],
    [/바이오|bio|제약|헬스케어|health/i, '🧬'],
    [/은행|금융|financial|증권/i, '🏦'],
    [/부동산|부동산/i, '🏠'],
    [/원자재|commodity/i, '⛏️'],
    [/암호화폐|비트코인|bitcoin|crypto/i, '₿'],
  ];
  for(const [re, emoji] of rules){ if(re.test(n)) return emoji; }
  return '📊';
}

function buildStockRow(stock){
  const cat = catalogFor(stock);
  const qty = stock.quantity || 0;
  const price = cat.currentPrice || 0;
  const cost = stockCostBasis(stock);
  const avgPrice = qty ? Math.round(cost / qty) : 0;
  const pl = stockPL(stock);
  const plPct = stockPLPercent(stock);
  const divMonths = [...new Set(recordsForStock(stock).map(r=>parseInt(r.month.split('-')[1],10)))].sort((a,b)=>a-b);
  const divMonthsStr = divMonths.length ? divMonths.join(', ') : '-';
  const divYield = stockYieldOnPrincipal(stock);
  const divTotal = stockDividendTotal(stock);

  const row = document.createElement('div');
  row.className = 'stock-row';
  row.id = `stockrow_${stock.id}`;
  row.innerHTML = `
    <div class="stock-card-head">
      <div class="stock-card-title">
        <span class="stock-card-name">${stockEmoji(cat.name, cat.ticker)} ${escapeHtml(cat.name)}</span>${cat.ticker ? '<span class="stock-card-ticker">('+escapeHtml(cat.ticker)+')</span>' : ''}
      </div>
      <div class="stock-card-qty">수량 <b class="num">${qty.toLocaleString('ko-KR')}</b></div>
    </div>
    <div class="stock-stat-grid">
      <div class="stock-stat"><span class="stock-stat-label">자산가치</span><span class="stock-stat-value num">${fmtWon(stockTotal(stock))}</span></div>
      <div class="stock-stat"><span class="stock-stat-label">구매가</span><span class="stock-stat-value num">${avgPrice.toLocaleString('ko-KR')}원</span></div>
      <div class="stock-stat"><span class="stock-stat-label">수익</span><span class="stock-stat-value num ${plClass(pl)}">${fmtPL(pl)}${plPct!==null ? ' ('+fmtPercent(plPct)+')' : ''}</span></div>
      <div class="stock-stat"><span class="stock-stat-label">현재가</span><span class="stock-stat-value num price-highlight">${price.toLocaleString('ko-KR')}원</span></div>
      <div class="stock-stat"><span class="stock-stat-label">배당월</span><span class="stock-stat-value">${divMonthsStr}</span></div>
      <div class="stock-stat"><span class="stock-stat-label">투자배당률</span><span class="stock-stat-value num" style="color:var(--gold);">${fmtPctPlain(divYield)}${divTotal ? ' ('+fmtWon(divTotal)+')' : ''}</span></div>
    </div>
  `;
  row.onclick = ()=>{
    openStockDetailSheet(stock.id);
  };
  return row;
}

function openStockDetailSheet(stockId){
  const stock = DATA.stocks.find(s=>s.id===stockId);

  const cat = catalogFor(stock);
  const title = cat.name + (cat.ticker ? ` (${cat.ticker})` : '');
  openSheet(title, buildStockDetailHtml(stock));
}

function scrollToId(id){
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const el = document.getElementById(id);
      if(!el) return;
      const sheetBody2 = document.getElementById('sheetBody2');
      const sheetBody = document.getElementById('sheetBody');
      const container = (sheetBody2 && sheetBody2.contains(el)) ? sheetBody2
        : (sheetBody && sheetBody.contains(el)) ? sheetBody
        : null;
      if(container){
        const cRect = container.getBoundingClientRect();
        const eRect = el.getBoundingClientRect();
        const delta = eRect.top - cRect.top - (cRect.height * 0.15);
        container.scrollBy({ top: delta, behavior:'smooth' });
        return;
      }
      const rect = el.getBoundingClientRect();
      const targetY = window.innerHeight * 0.5;
      const delta = rect.top - targetY;
      window.scrollBy({ top: delta, behavior:'smooth' });
    });
  });
}

function syncDateDisplay(inputEl){
  const disp = document.getElementById(inputEl.id + '_display');
  if(!disp) return;
  if(inputEl.value){
    disp.textContent = inputEl.value;
    disp.classList.add('has-value');
  } else {
    disp.textContent = disp.dataset.placeholder || '';
    disp.classList.remove('has-value');
  }
}

function toggleForm(id){
  const el = document.getElementById(id);
  const willOpen = !el.classList.contains('open');
  el.classList.toggle('open');
  if(willOpen) scrollToId(id);
}
function closeForm(id){
  document.getElementById(id).classList.remove('open');
}
function toggleInlineAccordion(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
}

function openSheet(title, bodyHtml){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
  if(openTargetSheetLayer.layer===1) openTargetSheetLayer = { key:null, layer:null };
  closeSheet2();
}

  document.getElementById('sheetBody2').innerHTML = bodyHtml;
  document.getElementById('sheetOverlay2').classList.add('open');

  document.getElementById('bottomSheet2').classList.remove('open');

    ? dividendListHtmlForStock(stock)
    : entryListHtml(stock[field], stockId, field);

async function deleteStockDividend(stockId, month){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(!stock) return;
  removeAccountFromDividendRecord(stock.key, month, stock.accountId);
  await saveData();
  render();
  if(document.getElementById('bottomSheet2').classList.contains('open')){
    document.getElementById('sheetBody2').innerHTML = dividendListHtmlForStock(stock);
  }
  refreshStockDetailSheetIfOpen(stockId);
  showToast('배당 기록을 삭제했어요');
}

function openMonthDividendSheet(month){
  const records = recordsForOwner(currentOwner).filter(r=>r.month===month);

  const [y,m] = month.split('-');
  const title = `${y}년 ${parseInt(m,10)}월 배당`;

  if(records.length===0){
    openSheet(title, `<div class="empty-hint">이 달엔 받은 배당이 없어요</div>`);
    return;
  }

  const sorted = [...records].sort((a,b)=> b.total - a.total);
  const total = sorted.reduce((s,r)=>s+r.total,0);

  const groupsHtml = sorted.map((rec, idx)=>{
    const gid = `divgrpacc_${idx}`;
    const totalQty = rec.accounts.reduce((s,a)=>s+(a.quantity||0),0);
    const accountRows = rec.accounts.map(a=>{
      const acc = DATA.accounts.find(x=>x.id===a.accountId);
      const owner = acc ? DATA.owners.find(o=>o.id===acc.ownerId) : null;
      return `
        <div class="entry-row" style="padding-left:10px;font-size:11.5px;">
          <span>${acc ? escapeHtml(acc.name) : '(알 수 없는 계좌)'}${owner ? ' · '+escapeHtml(owner.name) : ''} · ${(a.quantity||0).toLocaleString('ko-KR')}주</span>
          <span class="amt num">${fmtWon(a.amount)}</span>
        </div>
      `;
    }).join('');
    const keyEsc = rec.key.replace(/'/g,"\\'");
    return `
      <div style="margin-bottom:8px;">
        <div style="cursor:pointer;" onclick="toggleInlineAccordion('${gid}')">
          <div class="entry-row" style="font-weight:600;color:var(--text1);border-bottom:none;padding-bottom:2px;">
            <span style="font-size:14.5px;">${escapeHtml(rec.name)}</span>
            <span><span class="amt num" style="font-size:16.5px;">${fmtWon(rec.total)}</span><span class="del" onclick="event.stopPropagation();deleteMonthRecord('${keyEsc}','${month}')">삭제</span></span>
          </div>
          <div class="entry-row" style="font-size:11.5px;color:var(--text3);padding-top:0;">
            <span>총 <span class="num" style="color:var(--text1);">${totalQty.toLocaleString('ko-KR')}</span>주 보유${rec.perShare ? ' · 주당 <span class="num" style="color:var(--text1);">'+rec.perShare.toLocaleString('ko-KR')+'</span>원' : ''}</span>
            <span></span>
          </div>
        </div>
        <div id="${gid}" style="display:none;">${accountRows}</div>
      </div>
    `;
  }).join('');

  const bodyHtml = `
    <div style="margin-bottom:16px;">
      <div class="num" style="font-size:22px;font-weight:700;color:var(--gold);text-align:left;">${fmtWon(total)}</div>
    </div>
    ${groupsHtml}
  `;
  openSheet(title, bodyHtml);
}

async function submitAccount(){
  const nameEl = document.getElementById('newAccountName');
  const name = nameEl.value.trim();
  if(!name){ showToast('계좌 이름을 입력해주세요'); return; }
  DATA.accounts.push({ id: uid('acc'), ownerId: currentOwner, name });
  nameEl.value = '';
  closeForm('accountForm');
  await saveData();
  render();
  showToast('계좌가 추가되었습니다');
}

async function submitTx(stockId, field){
  const date = document.getElementById(`${field}_date_${stockId}`).value;
  const qty = parseFloat(document.getElementById(`${field}_qty_${stockId}`).value) || 0;
  const price = parseFloat(document.getElementById(`${field}_price_${stockId}`).value) || 0;
  if(!date){ showToast('날짜를 입력해주세요'); return; }
  if(!qty || !price){ showToast('수량과 단가를 입력해주세요'); return; }
  const amt = qty * price;
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(!stock[field]) stock[field] = [];
  stock[field].push({ id: uid('tx'), date, quantity: qty, price: price, amount: amt });
  if(field==='buys'){
    stock.quantity = (stock.quantity||0) + qty;
  } else if(field==='sells'){
    stock.quantity = Math.max(0, (stock.quantity||0) - qty);
  }
  await saveData();
  render();
  refreshStockDetailSheetIfOpen(stockId);
  showToast(`${qty}주 × ${price.toLocaleString('ko-KR')}원 = ${amt.toLocaleString('ko-KR')}원 반영했어요`);
}

async function submitDividend(stockId){
  const month = document.getElementById(`dv_month_${stockId}`).value;
  const perShare = parseFloat(document.getElementById(`dv_amount_${stockId}`).value) || 0;
  if(!month){ showToast('월을 선택해주세요'); return; }
  if(!perShare){ showToast('1주당 배당금을 입력해주세요'); return; }
  const stock = DATA.stocks.find(s=>s.id===stockId);
  const qty = stock.quantity || 0;
  const cat = catalogFor(stock);
  upsertDividendAccountEntry(stock.key, month, cat.name, cat.ticker, stock.accountId, qty, perShare);
  await saveData();
  render();
  refreshStockDetailSheetIfOpen(stockId);
  showToast(`주당 ${perShare.toLocaleString('ko-KR')}원 × ${qty.toLocaleString('ko-KR')}주 = ${(perShare*qty).toLocaleString('ko-KR')}원 반영했어요`);
}

async function deleteEntry(stockId, field, entryId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  const entry = (stock[field]||[]).find(e=>e.id===entryId);
  stock[field] = (stock[field]||[]).filter(e=>e.id!==entryId);
  if(entry && field==='buys'){
    stock.quantity = Math.max(0, (stock.quantity||0) - entry.quantity);
  } else if(entry && field==='sells'){
    stock.quantity = (stock.quantity||0) + entry.quantity;
  }
  await saveData();
  render();
  if(document.getElementById('bottomSheet2').classList.contains('open')){
    const bodyHtml = entryListHtml(stock[field], stockId, field);
    document.getElementById('sheetBody2').innerHTML = bodyHtml;
  }
  refreshStockDetailSheetIfOpen(stockId);
  showToast('삭제하고 보유수량도 되돌렸어요');
}

async function deleteStock(stockId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(stock){
    (DATA.dividends||[]).forEach(rec=>{
      if(rec.key===stock.key){
        rec.accounts = rec.accounts.filter(a=>a.accountId!==stock.accountId);
      }
    });
    DATA.dividends = (DATA.dividends||[]).filter(rec=>rec.accounts.length>0);
  }
  DATA.stocks = DATA.stocks.filter(s=>s.id!==stockId);
  openStocks.delete(stockId);
  closeSheet();
  await saveData();
  render();
  showToast('종목이 삭제되었습니다');
}

async function submitPrice(stockId){
  const input = document.getElementById(`price_input_${stockId}`);
  const num = parseFloat(input.value);
  if(isNaN(num)){ showToast('숫자를 입력해주세요'); return; }
  const stock = DATA.stocks.find(s=>s.id===stockId);
  const cat = catalogFor(stock);
  cat.currentPrice = num;
  const count = stocksMatchingKey(stock.key).length;
  closeForm(`priceform_${stockId}`);
  await saveData();
  render();
  refreshStockDetailSheetIfOpen(stockId);
  showToast(count>1 ? `현재가를 반영했어요 (같은 종목 ${count}개 계좌에 자동 적용)` : '현재가를 반영했어요');
}

document.getElementById('toggleJsonBtn').onclick = ()=>{
  const panel = document.getElementById('jsonPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) refreshJsonView();
};

document.getElementById('reloadJsonBtn').onclick = async ()=>{
  setSaveStatus('stock.json 다시 불러오는 중...');
  await loadData();
  showToast('stock.json을 다시 불러왔어요');
};

let isLightTheme = false;
function applyTheme(){
  document.body.classList.toggle('light-theme', isLightTheme);
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isLightTheme ? '다크 모드' : '라이트 모드';
}
async function loadThemePref(){
  if(hasWindowStorage){
    try{
      const res = await window.storage.get('theme-pref', false);
      if(res && res.value === 'light') isLightTheme = true;
    }catch(e){ /* 저장된 값 없음 */ }
  }
  applyTheme();
}
document.getElementById('themeToggleBtn').onclick = async ()=>{
  isLightTheme = !isLightTheme;
  applyTheme();
  if(hasWindowStorage){
    try{ await window.storage.set('theme-pref', isLightTheme ? 'light' : 'dark', false); }catch(e){}
  }
};
loadThemePref();

function refreshJsonView(){
  document.getElementById('jsonTextarea').value = JSON.stringify(DATA, null, 2);
  document.getElementById('jsonError').style.display = 'none';
}

async function applyParsedData(parsed, successMsg){
  if(!parsed || !parsed.owners || !parsed.accounts || !parsed.stocks){
    document.getElementById('jsonError').textContent = 'owners, accounts, stocks 세 항목이 모두 있어야 합니다.';
    document.getElementById('jsonError').style.display = 'block';
    return false;
  }
  document.getElementById('jsonError').style.display = 'none';
  DATA = parsed;
  if(!DATA.owners.find(o=>o.id===currentOwner) && currentOwner!=='ALL'){
    currentOwner = DATA.owners.length ? DATA.owners[0].id : null;
  }
  await saveData();
  render();
  showToast(successMsg || '데이터를 적용했습니다');
  return true;
}

async function applyJson(){
  const raw = document.getElementById('jsonTextarea').value;
  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    document.getElementById('jsonError').style.display = 'block';
    return;
  }
  await applyParsedData(parsed, 'JSON 데이터가 적용되었습니다');
}

function copyJson(){
  const text = document.getElementById('jsonTextarea').value || JSON.stringify(DATA, null, 2);
  navigator.clipboard.writeText(text).then(()=>{
    showToast('클립보드에 복사되었습니다');
  }).catch(()=>{
    showToast('복사에 실패했습니다. 직접 선택해 복사해주세요');
  });
}

function exportJsonFile(){
  const text = JSON.stringify(DATA, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'stock.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('stock.json 파일을 내보냈어요');
}

function triggerImportFile(){
  document.getElementById('importFileInput').click();
}

document.getElementById('importFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    let parsed;
    try{
      parsed = JSON.parse(evt.target.result);
    }catch(err){
      showToast('올바른 JSON 파일이 아니에요');
      e.target.value = '';
      return;
    }
    const ok = await applyParsedData(parsed, 'stock.json을 불러왔어요');
    if(ok) refreshJsonView();
    e.target.value = '';
  };
  reader.readAsText(file);
});

loadData();
</script>
