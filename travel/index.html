function gsReset(){GQM.forEach(k=>{k.m.map=null});GQM=[];GQ=[];GQS=-1;GSM='ac';const o=$('gsr');if(o)o.classList.remove('more');const b=$('gsok'),g=$('gsgo');if(g)g.disabled=true;if(b){b.disabled=true;b.textContent='장소를 선택해 주세요'}}
async function gOpen(id){const el=$(id);if(!el)return;GTOK=null;GS=[];gsReset();
const o=$('gsr');o.className='gsr on';
o.innerHTML=`<div class="gsin" id="gsin"><div class="hd"><button class="back" onclick="gsClose()">${XL}</button><input class="in" id="gs_q" value="${esc(el.value)}" placeholder="장소 이름·주소로 검색" oninput="gsInput()" onkeydown="if(event.key=='Enter')this.blur()"></div><div id="gsmap"></div><div class="gsl" id="gsl"></div><div class="gsbar"><button class="btn g" id="gsgo" disabled onclick="gsGo()">구글지도</button><button class="btn" id="gsok" disabled onclick="gsPick()">장소를 선택해 주세요</button></div></div>`;
gsHint();gsVV();if(window.visualViewport){visualViewport.addEventListener('resize',gsVV);visualViewport.addEventListener('scroll',gsVV)}
document.body.style.overflow='hidden';$('gs_q').focus();setTimeout(gsVV,350);await gsMap();if(el.value.trim().length>=2)gsAC()}
function gsInput(){clearTimeout(GT);GT=setTimeout(()=>{if(GSM=='more')gsReset();gsAC()},500)}
async function gsAC(){const inp=$('gs_q');if(!inp)return;const t=inp.value.trim();if(t.length<2){gsHint();return}
try{await gmaps();const{AutocompleteSuggestion,AutocompleteSessionToken}=await google.maps.importLibrary('places');GTOK=GTOK||new AutocompleteSessionToken();
const req={input:gQ(t),sessionToken:GTOK,language:'ko'},bi=gBias();if(bi)req.locationBias=bi;
const{suggestions}=await AutocompleteSuggestion.fetchAutocompleteSuggestions(req);
const cur=$('gs_q');if(GSM!='ac'||!cur||cur.value.trim()!=t)return;
GS=suggestions.map(x=>x.placePrediction).filter(Boolean);
$('gsl').innerHTML=(GS.map((p,i)=>`<div class="gsw"><button class="gsm" onclick="gsAcPick(${i})"><b>${esc(p.mainText.text)}</b><small>${esc(p.secondaryText?p.secondaryText.text:'')}</small></button><button class="gsg" onclick="gsLink(${i})">지도↗</button></div>`).join('')||'<div class="hint">검색 결과가 없어요</div>')+`<button class="sgm" onclick="gsMore()">더 많은 결과 보기 (지도에서 최대 20곳)<small>누를 때만 추가 검색해요 · 이번 달 ${gmCnt()}/${GMAX}회</small></button>`}
catch(e){const l=$('gsl');if(l)l.innerHTML=`<div class="hint">${esc(gErr(e))}</div>`}}
function gsLink(i){const p=GS[i];if(p)go2(gmPlace(p.text?p.text.text:p.mainText.text,p.placeId))}
async function gsAcPick(i){try{const p=GS[i],pl=p.toPlace();await pl.fetchFields({fields:['formattedAddress','location']});GTOK=null;
const d={title:p.mainText.text,addr:pl.formattedAddress,lat:pl.location.lat(),lng:pl.location.lng(),id:p.placeId};gCtr(d);gsClose();if(GCB)GCB(d)}
catch(e){const l=$('gsl');if(l)l.innerHTML=`<div class="hint">${esc(gErr(e))}</div>`}}
async function gsMore(){const inp=$('gs_q');if(!inp)return;const q=inp.value.trim();if(q.length<2)return;inp.blur();GTOK=null;gsReset();GSM='more';
const l=$('gsl');
if(gmCnt()>=GMAX){GSM='ac';l.innerHTML=`<div class="hint">이번 달 "더 많은 결과 보기" 한도(${GMAX.toLocaleString()}회)에 도달했어요.<br>무료 한도를 넘지 않도록 막아 두었어요. 다음 달에 다시 쓸 수 있어요.</div>`;return}
l.innerHTML='<div class="hint">검색 중…</div>';
try{await gmaps();const{Place}=await google.maps.importLibrary('places'),{AdvancedMarkerElement}=await google.maps.importLibrary('marker');
if(!await gsMap(true))throw new Error('지도를 불러오지 못했어요');
const req={textQuery:gQ(q),fields:['id','displayName','formattedAddress','location'],maxResultCount:20,language:'ko'},bi=gBias();if(bi)req.locationBias=bi;
gmInc();const{places}=await Place.searchByText(req);if(GSM!='more'||!$('gsr').classList.contains('on'))return;
GQ=places.map(p=>({id:p.id,title:p.displayName,addr:p.formattedAddress,lat:p.location.lat(),lng:p.location.lng()}));
l.innerHTML=GQ.length?`<div class="hint gsc">검색 결과 ${GQ.length}곳</div>`+GQ.map((r,i)=>`<button class="gsi" id="gsi_${i}" onclick="gsSel(${i})"><span class="gsn">${i+1}</span><div><b>${esc(r.title)}</b><small>${esc(r.addr||'')}</small></div></button>`).join(''):'<div class="hint">검색 결과가 없어요</div>';
$('gsr').classList.add('more');
GQM=GQ.map((r,i)=>{const c=document.createElement('div');c.className='gpin';c.style.background='var(--pri)';c.textContent=i+1;const m=new AdvancedMarkerElement({map:GMAP,position:{lat:r.lat,lng:r.lng},content:c,title:r.title});m.addListener('click',()=>gsSel(i,true));return{c,m}});
if(GQ.length==1)gsSel(0);else if(GQ.length){const b=new google.maps.LatLngBounds();GQ.forEach(r=>b.extend({lat:r.lat,lng:r.lng}));GMAP.fitBounds(b,{top:30,right:30,bottom:30,left:30})}
}catch(e){l.innerHTML=`<div class="hint">${esc(gErr(e))}</div>`;GSM='ac'}}
function gsSel(i,sc){const r=GQ[i];if(!r)return;GQS=i;
GQ.forEach((x,k)=>{const e=$('gsi_'+k);if(e)e.classList.toggle('on',k==i);if(GQM[k]){GQM[k].c.classList.toggle('on',k==i);GQM[k].m.zIndex=k==i?1000:null}});
const b=$('gsok'),g=$('gsgo');if(g)g.disabled=false;if(b){b.disabled=false;b.textContent='이 장소로 선택'}
if(sc){const e=$('gsi_'+i),l=$('gsl');if(e&&l)l.scrollTo({top:e.offsetTop-8,behavior:'smooth'})}
gFly({lat:r.lat,lng:r.lng},Math.max(GMAP.getZoom()||0,15))}
function gsGo(){const r=GQ[GQS];if(r)go2(gmPlace(r.title+(r.addr?' '+r.addr:''),r.id))}
function gsPick(){const r=GQ[GQS];if(!r)return;const d={title:r.title,addr:r.addr,lat:r.lat,lng:r.lng,id:r.id};gCtr(d);gsClose();if(GCB)GCB(d)}
function gsClose(){gsReset();clearTimeout(GT);const o=$('gsr'),h=$('gmap');if(h&&GMAPEL)h.appendChild(GMAPEL);
if(window.visualViewport){visualViewport.removeEventListener('resize',gsVV);visualViewport.removeEventListener('scroll',gsVV)}
document.body.style.overflow='';o.className='gsr';o.innerHTML='';if(GM.on&&view=='trip'&&!GM.full)drawMap()}
async function gLocate(){const msg=t=>{const e=$('gm_h');if(e)e.textContent=t};
try{await gmaps();const{Geocoder}=await google.maps.importLibrary('geocoding'),g=new Geocoder(),todo=S.items.filter(x=>x.lat==null&&x.type!='flight'&&x.type!='other');let ok=0,i=0;
if(!todo.length){msg('위치를 찾을 일정이 없어요');return}
for(const x of todo){i++;msg(`위치 찾는 중 ${i}/${todo.length}`);
const q=[x.title,x.sub&&x.sub!='나만의 장소'?x.sub:'',gArea()].filter(Boolean).join(' ');
try{const r=await g.geocode({address:q,language:'ko'});if(r.results&&r.results[0]){const pr=r.results[0];x.lat=pr.geometry.location.lat();x.lng=pr.geometry.location.lng();x.addr=pr.formatted_address;x.gx=1;ok++}}catch(e){}
await new Promise(r=>setTimeout(r,120))}
save();render();msg(`${ok}곳 위치를 찾았어요 (${todo.length-ok}곳은 못 찾았어요). "위치 확인"에서 맞는지 확인해 보세요`)}
catch(e){msg(gErr(e))}}
function geoCheck(){const L=S.items.filter(x=>x.type!='flight'&&x.type!='other');
sheet(hd3('위치 확인',`${L.filter(x=>x.lat!=null).length}/${L.length}곳에 위치가 있어요`)+`<div class="gl">${L.map(x=>`<button class="gi" onclick="locSheet(${x.id},'geo')"><div><b>${esc(x.title)}</b><small>${x.lat!=null?esc(x.addr||'좌표만 있음'):'위치 없음'}</small></div><span class="${x.lat==null?'bad':x.gx?'warn':'ok'}">${x.lat==null?'!':x.gx?'?':'✓'}</span></button>`).join('')}</div><div class="hint">✓ 확인됨 · ? 자동으로 찾은 위치(확인 필요) · ! 위치 없음</div>`)}
const locStat=x=>x.lat==null?{c:'s3',i:'!',b:'위치 미등록',t:'위치 미등록',d:'지도에 마커로 표시되지 않아요. 아래에서 장소를 검색해 지정해 보세요'}:x.gx?{c:'s2',i:'?',b:'위치 확인 필요',t:'자동으로 찾은 위치',d:(x.addr||x.lat+', '+x.lng)+' · 정확한지 확인이 필요해요'}:{c:'s1',i:'✓',b:'위치 등록됨',t:x.pid?'위치 등록됨 · 구글지도 장소 연결':'위치 등록됨 · 좌표만 저장',d:x.addr||x.lat+', '+x.lng};
const locBtn=(x,id)=>{const t=locStat(x);return `<button class="btn g loc ${t.c}" id="locbtn_${id}" onclick="locSheet(${id})">${t.i} ${t.b}</button>`};
const locCard=x=>{const t=locStat(x);return `<div class="lst ${t.c}"><span class="lsi">${t.i}</span><div><b>${t.t}</b><small>${esc(t.d)}</small></div><button class="tipb" onclick="tip(event,'loc')">i</button></div>`};
const locSync=(x,id)=>{const b=$('locbtn_'+id);if(b)b.outerHTML=locBtn(x,id)};
const TIPS={map:'<b>구글지도 버튼은 이렇게 열려요</b><br>① 지도 링크가 있으면 → 그 링크<br>② 링크가 없고 위치가 등록돼 있으면 → 그 위치<br>③ 둘 다 없으면 → 이름으로 검색<br><br>장소 검색으로 고르면 지도 링크 칸에 그 장소 링크가 자동으로 채워져요. 다른 링크를 붙여넣으면 그 링크가 열려요.',loc:'<b>위치 등록 상태</b><br>✓ 장소 연결: 검색으로 고른 정확한 장소<br>✓ 좌표만 저장: 위치만 저장돼 핀으로 열려요<br>? 자동으로 찾은 위치: 확인이 필요해요<br>! 미등록: 지도 탭에 마커가 나오지 않아요'};
function tip(e,t){e.stopPropagation();const o=$('tipb');if(o){const same=o.dataset.t==t;o.remove();if(same)return}
const r=e.currentTarget.getBoundingClientRect(),d=document.createElement('div'),w=Math.min(300,innerWidth-32);d.id='tipb';d.className='tipbub';d.dataset.t=t;d.innerHTML=TIPS[t];d.style.width=w+'px';d.style.left=Math.max(16,Math.min(innerWidth-w-16,r.right-w))+'px';d.style.top=(r.bottom+8)+'px';document.body.appendChild(d);
if(r.bottom+8+d.offsetHeight>innerHeight-16)d.style.top=Math.max(16,r.top-8-d.offsetHeight)+'px'}
document.addEventListener('click',()=>{const o=$('tipb');if(o)o.remove()});
function locSheet(id,from){const x=S.items.find(i=>i.id==id);GCB=d=>{x.lat=d.lat;x.lng=d.lng;x.addr=d.addr;if(d.id){x.pid=d.id;x.map=gmPlace(d.title,d.id)}else delete x.pid;delete x.gx;save();shut2();render();locSync(x,id);if(from=='geo')geoCheck()};
sheet2(hd3(esc(x.title),'위치 지정')+locCard(x)+fg('장소 검색',`<input class="in" id="g_q" value="${esc(x.title)}" placeholder="장소 이름·주소" readonly onclick="gOpen('g_q')"><div id="g_sg" class="sg"></div><div class="hint">${gArea()?'🔎 검색 지역: '+esc(gArea()):''}</div>`)+btns(bD('위치 삭제',`locDel(${id},'${from||''}')`),bG('닫기','shut2()')))}
function locDel(id,from){const x=S.items.find(i=>i.id==id);delete x.lat;delete x.lng;delete x.addr;delete x.gx;delete x.pid;save();shut2();render();locSync(x,id);if(from=='geo')geoCheck()}
applyTheme(getTheme());
render();
dgInit();addEventListener('resize',setHdh);let spyT=0;addEventListener('scroll',()=>{if(spyT)return;spyT=requestAnimationFrame(()=>{spyT=0;gSpy()})},{passive:true});
autoLoad();
</script></body></html>
