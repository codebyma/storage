async function gLocate(){const msg=t=>{const e=$('gm_h');if(e)e.textContent=t};
try{await gmaps();const{Geocoder}=await google.maps.importLibrary('geocoding'),g=new Geocoder(),todo=S.items.filter(x=>x.lat==null&&x.type!='flight'&&x.type!='other');let ok=0,i=0;
if(!todo.length){msg('위치를 찾을 일정이 없어요');return}
for(const x of todo){i++;msg(`위치 찾는 중 ${i}/${todo.length}`);
const q=[x.title,gArea()].filter(Boolean).join(' ');
try{const r=await g.geocode({address:q,language:'ko'});if(r.results&&r.results[0]){const pr=r.results[0];x.lat=pr.geometry.location.lat();x.lng=pr.geometry.location.lng();x.addr=pr.formatted_address;x.gx=1;ok++}}catch(e){}
await new Promise(r=>setTimeout(r,120))}
save();render();syncNow();msg(`${ok}곳 위치를 찾았어요 (${todo.length-ok}곳은 못 찾았어요). "위치 확인"에서 맞는지 확인해 보세요`)}
catch(e){msg(gErr(e))}}
function geoCheck(){const L=S.items.filter(x=>x.type!='flight'&&x.type!='other');
sheet(hd3('위치 확인',`${L.filter(x=>x.lat!=null).length}/${L.length}곳에 위치가 있어요`)+`<div class="gl">${L.map(x=>`<button class="gi" onclick="locSheet(${x.id},'geo')"><div><b>${esc(x.title)}</b><small>${x.lat!=null?esc(x.addr||'좌표만 있음'):'위치 없음'}</small></div><span class="${x.lat==null?'bad':x.gx?'warn':'ok'}">${x.lat==null?'!':x.gx?'?':'✓'}</span></button>`).join('')}</div><div class="hint">✓ 확인됨 · ? 자동으로 찾은 위치(확인 필요) · ! 위치 없음</div>`)}
const locStat=x=>x.lat==null?{c:'s3',i:'!',b:'위치 미등록',t:'위치 미등록',d:'지도에 마커로 표시되지 않아요. 아래에서 장소를 검색해 지정해 보세요'}:x.gx?{c:'s2',i:'?',b:'위치 확인 필요',t:'자동으로 찾은 위치',d:(x.addr||x.lat+', '+x.lng)+' · 정확한지 확인이 필요해요',cp:x.addr||x.lat+', '+x.lng}:{c:'s1',i:'✓',b:'위치 등록됨',t:x.pid?'위치 등록됨 · 구글지도 장소 연결':'위치 등록됨 · 좌표만 저장',d:x.addr||x.lat+', '+x.lng,cp:x.addr||x.lat+', '+x.lng};
const locBtn=(x,id)=>{const t=locStat(x);return `<button class="btn g loc ${t.c}" id="locbtn_${id}" onclick="locSheet(${id})">${t.i} ${t.b}</button>`};
const locCard=(x,a)=>{const t=locStat(x);return `<div class="lst ${t.c}"><div><div class="lh"><b class="lbt" onclick="tip(event,'loc')"><span class="tipb lsi">${t.i}</span>${t.t}</b>${a?`<span class="lacts">${a}</span>`:''}</div><small${t.cp?` class="lcp" data-c="${esc(t.cp)}" onclick="copyTxt(this.dataset.c)"`:''}>${esc(t.d)}</small></div></div>`};
const locActs=d=>`<button class="tipb" onclick="tip(event,'map')">?</button><button class="lchip" onclick="go2(fMapUrl())"><span class="lem">📍</span>구글지도</button>${d.lat!=null?'<button class="lchip del" onclick="fLocClear()">위치 삭제</button>':''}`;
const locSync=(x,id)=>{const b=$('locbtn_'+id);if(b)b.outerHTML=locBtn(x,id)};
const TIPS={map:'<b>구글지도 버튼은 이렇게 열려요</b><br>① 지도 링크가 있으면 → 그 링크<br>② 링크가 없고 위치가 등록돼 있으면 → 그 위치<br>③ 둘 다 없으면 → 이름으로 검색<br><br>장소 검색으로 고르면 지도 링크 칸에 그 장소 링크가 자동으로 채워져요. 다른 링크를 붙여넣으면 그 링크가 열려요.',alert:'<b>이런 때 얼럿이 떠요</b><br>접속한 시점의 서버 데이터와 이 기기 데이터가 달라졌을 때만 떠요<br>✓ 변경 내용을 합쳐 저장: 저장 전에 다른 사람이 올린 변경이 있어서 항목 단위로 합쳤어요. 날짜는 그 변경이 저장된 시각이에요<br>✓ 저장 안 된 변경과 합침: 앱을 열 때 최신 파일과 합쳤어요. 저장을 눌러야 반영돼요<br>✓ 최신 파일을 불러옴: 다른 사람이 저장한 내용으로 바뀌었어요<br>! 같은 항목을 둘 다 고침: 이 기기 내용이 남아요<br>! 저장 취소 · 불러오지 않음: 덮어쓰기 확인에서 취소했어요<br><br>저장했어요 · 불러왔어요 같은 일반 안내는 잠깐 떴다 사라지는 토스트로 나와요',loc:'<b>위치 등록 상태</b><br>✓ 장소 연결: 검색으로 고른 정확한 장소<br>✓ 좌표만 저장: 위치만 저장돼 핀으로 열려요<br>? 자동으로 찾은 위치: 확인이 필요해요<br>! 미등록: 지도 탭에 마커가 나오지 않아요'};
function tip(e,t){e.stopPropagation();const o=$('tipb');if(o){const same=o.dataset.t==t;o.remove();if(same)return}
const r=e.currentTarget.getBoundingClientRect(),d=document.createElement('div'),w=Math.min(300,innerWidth-32);d.id='tipb';d.className='tipbub';d.dataset.t=t;d.innerHTML=TIPS[t];d.style.width=w+'px';d.style.left=Math.max(16,Math.min(innerWidth-w-16,r.right-w))+'px';d.style.top=(r.bottom+8)+'px';document.body.appendChild(d);
if(r.bottom+8+d.offsetHeight>innerHeight-16)d.style.top=Math.max(16,r.top-8-d.offsetHeight)+'px'}
document.addEventListener('click',()=>{const o=$('tipb');if(o)o.remove()});
function locSheet(id,from){const x=S.items.find(i=>i.id==id);GCB=d=>{x.lat=d.lat;x.lng=d.lng;x.addr=d.addr;if(d.id){x.pid=d.id;x.map=gmPlace(d.title,d.id)}else delete x.pid;delete x.gx;save();shut2();render();syncNow();locSync(x,id);if(from=='geo')geoCheck()};
sheet2(hd3(esc(x.title),'위치 지정')+locCard(x)+fg('장소 검색',`<input class="in" id="g_q" value="${esc(x.title)}" placeholder="장소 이름·주소" readonly onclick="gOpen('g_q')"><div id="g_sg" class="sg"></div><div class="hint">${gArea()?'🔎 검색 지역: '+esc(gArea()):''}</div>`)+btns(bD('위치 삭제',`locDel(${id},'${from||''}')`),bG('닫기','shut2()')))}
function locDel(id,from){const x=S.items.find(i=>i.id==id);delete x.lat;delete x.lng;delete x.addr;delete x.gx;delete x.pid;save();shut2();render();syncNow();locSync(x,id);if(from=='geo')geoCheck()}
