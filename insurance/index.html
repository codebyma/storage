  <style>
    :root {
      --bg: #0f1115;
      --surface1: #171a20;
      --surface2: #1e232b;
      --border: #2a3038;
      --border-strong: #3a4149;
      --text1: #edf0f3;
      --text2: #aab3c0;
      --text3: #a0aab8;
      --mint: #4ade9a;
      --mint-dim: #1f3a2c;
      --gold: #e8b04b;
      --gold-dim: #3a2f18;
      --blue: #5b9bd5;
      --blue-dim: #1c2c3a;
      --red: #e2635a;
      --divider-gray: #3a4149;
      --mark: #6b5a12;
      --ins0: #e57373;
      --ins1: #7e8ce0;
      --ins2: #4db6ac;
      --ins3: #ba68c8;
      --ins4: #f08a4b;
      --ins5: #81c784;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background: var(--bg)
    }

    body.light-theme {
      --bg: #fff;
      --surface1: #f5f6f8;
      --surface2: #eef0f3;
      --border: #e6e8ec;
      --border-strong: #e5e7eb;
      --text1: #191f28;
      --text2: #444f5d;
      --text3: #556070;
      --mint: #0f7a50;
      --mint-dim: #e6f7f0;
      --gold: #8c5c06;
      --gold-dim: #fbf3e2;
      --blue: #2f6fb0;
      --blue-dim: #eaf3fb;
      --red: #c33a2f;
      --divider-gray: #f2f2f2;
      --mark: #fde68a;
      --ins0: #cf4a4a;
      --ins1: #4a5bc4;
      --ins2: #1f8a80;
      --ins3: #9a3fb0;
      --ins4: #d36a1f;
      --ins5: #3f8f45
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text1);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .15s, color .15s;
      padding-bottom: 60px;
      overflow-x: hidden
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 2px
    }

    .num {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-family: 'Roboto', sans-serif;
      letter-spacing: -.4px
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 0
    }

    .app-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text1);
      letter-spacing: -.5px
    }

    .theme-icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border-strong);
      color: var(--text2);
      border-radius: 10px;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    .theme-icon-btn:active {
      transform: scale(.95)
    }

    .owner-tabs {
      display: flex;
      gap: 8px;
      padding: 16px 20px 0
    }

    .owner-tab,
    .range-tab {
      text-align: center;
      border: 1px solid var(--border);
      background: var(--surface1);
      color: var(--text2);
      cursor: pointer;
      font-weight: 500
    }

    .owner-tab {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 14px
    }

    .range-tab {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      flex: none
    }

    .owner-tab.active,
    .range-tab.active {
      background: var(--mint-dim);
      border-color: var(--mint);
      color: var(--mint)
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 20px 4px
    }

    .metric {
      background: var(--surface1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px
    }

    .metric.full {
      grid-column: 1/-1
    }

    .metric .label {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 6px
    }

    .metric .value {
      font-size: 19px;
      font-weight: 500
    }

    .metric .sub {
      font-size: 12px;
      color: var(--text3);
      margin-top: 2px
    }

    .panel-wrap {
      padding: 0 20px
    }

    .dash {
      padding: 0 20px
    }

    .dash-t {
      font-size: 13px;
      color: var(--text2);
      margin: 16px 0 8px
    }

    .dash-g {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px
    }

    .dc {
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 14px;
      align-items: center;
      text-align: left;
      background: var(--surface1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      color: inherit
    }

    .dc:active {
      transform: scale(.98)
    }

    .dc .l {
      grid-column: 1;
      grid-row: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text1)
    }

    .dc .v {
      grid-column: 2;
      grid-row: 1 / span 2;
      font-size: 15px;
      font-weight: 500;
      text-align: right
    }

    .dc .s {
      grid-column: 1;
      grid-row: 2;
      font-size: 11.5px;
      color: var(--text3);
      margin-top: 4px;
      line-height: 1.45
    }

    #out {
      scroll-margin-top: calc(var(--stk, 112px) + 8px)
    }

    @media (max-width:420px) {
      .vtab {
        font-size: 14px
      }

합니다.\n① 무배당 메리츠 가족단위보험 M-Story1009 1종 보통약관(이하「보통약관」이라 합니다) 제25조(계약 전 알릴 의무)의 규정에 의하여 계약자 또는 피보험자(보험대상자)가 회사에 알린 내용 또는 건강진단 내용이 보험금 지급사유의 발생 에 영향을 미쳤음을 회사가 증명하는 경우\n② 보통약관 제27조(알릴 의무 위반의 효과)를 준용하여 회사가 보장을 하지 아니할 수 있는 경우\n③ 진단계약에서 보험금 지급사유 발생시까지 진단을 받지 아니한 경우\n【고액암보장개시일[예시](단, 보험나이 15세 이상인 경우)】 계약일 보장개시일 90일 2010년 4월 10일 2010년 7월 9일","갱신형 급성심근경색증진단":"2-22. 갱신형 급성심근경색증진단비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 갱신형 급성심근경색증진단비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중 급성심근경색증으로 진단확정 되었을 때에는 보험수익자(보험금을 받는 자)에게 급성심근경색증진단비를 지급하여 드립니다.","갱신형 뇌졸중진단비":"2-20. 갱신형 뇌졸중진단비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 갱신형 뇌졸중진단비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중 뇌졸중 으로 진단확정 되었을 때에는 보험수익자(보험금을 받는 자)에게 뇌졸중진단비를 지급하여 드립니다.","갱신형 상해입원의료비(A)":"① 회사는 피보험자(보험대상자)가 상해로 인하여 병원에 입원하여 치료를 받은 경우에는 입원의료비를 다음 과 같이 하나의 상해당 보험가입금액(5,000만원을 최고한도로 계약자가 정하는 금액으로 합니다)을 한도 로 보상하여 드립니다. 구 분 보상금액 입원실료, 입원제비용, 입원수술비 「국민건강보험법에서 정한 요양급여 또는 의료급여법에서 정한 의료급여 중 본 인부담금」과「비급여(상급병실료 차액 제외)」부분의 합계액 중 90% 해당액(다 만, 10% 해당액이 계약일 또는 매년 계약해당일로부터 연간 200만원을 초과하는 경우 그 초과금액은 보상합니다) 상급병실료차액 입원시 실제 사용병실과 기준병실과의 병실료 차액 중 50%를 공제한 후의 금액 (다만, 1일 평균금액 10만원을 한도로 하며, 1일 평균금액은 입원기간 동안 상급 병실료 차액 전체를 총 입원일수로 나누어 산출합니다)\n② 제1항의 상해에는 유독가스 또는 유독물질을 우연하게도 일시에 흡입, 흡수 또는 섭취한 결과로 생긴 중 독증상을 포함합니다. 그러나 세균성 음식물 중독과 상습적으로 흡입, 흡수 또는 섭취한 결과로 생긴 중 독증상은 이에 포함되지 아니합니다.\n(1) 상해입원\n③ 피보험자(보험대상자)가 국민건강보험법 또는 의료급여법을 적용받지 못하는 경우(국민건강보험법에서 정 한 요양급여 또는 의료급여법에서 정한 의료급여 절차를 거치지 아니한 경우도 포함합니다)에는 입원의료 비 중 본인이 실제로 부담한 금액의 40% 해당액을 하나의 상해당 보험가입금액(5,000만원을 최고한도로 계약자가 정하는 금액으로 합니다)을 한도로 보상하여 드립니다.\n④ 회사는 하나의 상해(동일 상해로 2회 이상 치료를 받는 경우에도 이를 하나의 상해로 봅니다)로 인한 입 원의료비를 최초 입원일로부터 365일까지(최초 입원일을 포함합니다) 보상합니다. 다만, 동일한 상해로 인하여 최초 입원일로부터 365일을 넘어 입원할 경우에는 아래의 예시와 같이 90일간의 보상제외기간이 지나야 새로운 상해로 보아 다시 보상하여 드립니다. <보상기간 예시> 보상대상기간\n(365일) ↑ 계약일\n(2010.4.1) ↑ 최초 입원일\n(2010.6.1) 보상제외\n(90일) ↑\n(2011.5.31) 2011.6.1.부터 보상제외 보상대상기간\n(365일) ↑\n(2011.8.29) 2011.8.30.부터 보상재개 ↑\n(2012.8.28) 2012.8.29.부터 보상제외\n⑤ 피보험자(보험대상자)가 입원하여 치료를 받던 중 보험기간이 만료되더라도 그 계속 중인 입원에 대하여 는 보험기간 종료일로부터 180일까지(보험기간 종료일은 제외합니다) 보상하여 드립니다. 다만, 이 경우 제4항은 적용하지 아니합니다.\n⑥ 피보험자(보험대상자)가 병원의 직원복리후생제도에 의하여 납부할 의료비를 감면받은 경우에는 그 감면 전 의료비를 기준으로 입원의료비를 계산합니다.\n(2) 상해통원","갱신형 상해통원의료비(A)":"① 회사는 피보험자(보험대상자)가 상해로 인하여 병원에 통원하여 치료를 받거나 처방조제를 받은 경우에는 통원의료비로서 매년 계약해당일로부터 1년을 단위로 하여 다음과 같이 외래(외래제비용, 외래수술비) 및 처방조제비를 각각 보상하여 드립니다. 구분 보 상 한 도 외래 방문 1회당「국민건강보험법에서 정한 요양급여 또는 의료급여법에서 정한 의료급 담보 종목 보상하는 사항 여 중 본인부담금」과「비급여」부분의 합계액에서 ＜표1 항목별 공제금액＞을 차 감하고 외래의 보험가입금액주)을 한도로 보상(매년 계약해당일로부터 1년간 방문 180회 한도) 처방전 1건당「국민건강보험법에서 정한 요양급여 또는 의료급여법에서 정한 의료 급여 중 본인부담금」과「비급여」부분의 합계액에서 ＜표1 항목별 공제금액＞을 차감하고 처방조제비의 보험가입금액주)을 한도로 보상(매년 계약해당일로부터 1년 간 처방전 180건 한도) 처방 조제비\n주) 외래 및 처방조제비는 회(건)당 합산하여 30만원을 최고한도로 계약자가 정하는 금액으로 합니다. ＜표1 항목별 공제금액＞ 구 분 항 공제 금액 목 의료법 제3조 제2항 제1호에 의한 의원, 치과의원, 한의원, 의 료법 제3조 제2항 제2호에 의한 조산원, 지역보건법 제7조에 의 한 보건소, 지역보건법 제8조에 의한 보건의료원, 지역보건법\n제10조에 의한 보건지소, 농어촌 등 보건의료를 위한 특별조치 외래 (외래제비용 및 법 제15조에 의한 보건진료소 외래수술비 합계) 의료법 제3조 제2항 제3호에 의한 병원, 치과병원, 한방병원, 요양병원, 종합병원\n(2) 상해통원 처방 조제비 1만원 1만 5천원 국민건강보험법 제40조 제2항에 의한 종합전문요양기관 또는 의 료법 제3조의 4에 의한 상급종합병원 2만원 국민건강보험법 제40조 제1항 제2호에 의한 약국, 동법 제40조 제 1항 제3호에 의한 한국희귀의약품센터에서의 처방, 조제(의사의 처방전 1건당, 의약분업 예외지역에서 약사의 직접조제 1건당) 8천원\n② 피보험자(보험대상자)가 통원하여 치료를 받던 중 보험기간이 만료되더라도 그 계속 중인 통원 치료에 대 하여는 보험기간 만료일로부터 180일 이내에 외래는 방문 90회, 처방조제비는 처방전 90건을 한도로 보상 하여 드립니다. <보상기간 예시> 보상대상기간\n(1년) ↑ 계약일\n(2010.4.1) 보상대상기간\n(1년) ↑ 계약해당일\n(2011.4.1) ↑ 계약해당일\n(2012.4.1) 보상대상기간\n(1년) 추가보상\n(180일) ↑ 보험기간 종료일\n(2013.3.31) ↑ 보상종료\n(2013.9.27)\n③ 하나의 상해로 인해 하루에 같은 치료를 목적으로 의료기관에 2회 이상 통원치료시(하나의 상해로 약국을 통한 2회 이상의 처방조제를 포함합니다) 1회의 외래 및 1건의 처방으로 간주하여 제1항 및 제2항을 적용 합니다. 단, 의료기관을 2회이상 방문시 외래의 공제금액은 방문 의료기관의 공제금액 중 가장 큰 금액을 1회에 한하여 적용합니다.\n④ 제1항의 상해에는 유독가스 또는 유독물질을 우연하게도 일시에 흡입, 흡수 또는 섭취한 결과로 생긴 중 독증상을 포함합니다. 그러나 세균성 음식물 중독과 상습적으로 흡입, 흡수 또는 섭취한 결과로 생긴 중 독증상은 이에 포함되지 아니합니다.\n⑤ 피보험자(보험대상자)가 국민건강보험법 또는 의료급여법을 적용받지 못하는 경우(국민건강보험법에서 정 한 요양급여 또는 의료급여법에서 정한 의료급여 절차를 거치지 아니한 경우도 포함합니다)에는 통원의료 담보 종목\n(2) 상해통원 보상하는 사항 비 중 본인이 실제로 부담한 금액에서 ＜표1 항목별 공제금액＞을 차감한 금액의 40% 해당액을 외래 및 처방조제비로 보험가입금액(외래 및 처방조제비는 회(건)당 합산하여 30만원을 최고한도로 계약자가 정하 는 금액으로 합니다)을 한도로 보상하여 드립니다.\n⑥ 피보험자(보험대상자)가 병원 또는 약국의 직원복리후생제도에 의하여 납부할 의료비를 감면받은 경우에 는 그 감면 전 의료비를 기준으로 통원의료비를 계산합니다.","갱신형 암진단비":"2-15. 갱신형 암진단비보장 특별약관\n제1조(제1회 보험료 및 회사의 보장개시)\n① 우리회사(이하「회사」라 합니다)는 계약의 청약을 승낙하고 제1회 보험료를 받은 때(자동이체납입 및 신용카드납입의 경우에는 자동이체신청 및 신용카드매출 승인에 필요한 정보를 제공한 때. 다만, 계약자의 귀책 사유로 보험료 납입 및 승 인이 불가능한 경우에는 그러하지 아니합니다)부터 이 갱신형 암진단비보장 특별약관(이하「특별약관」이라 합니다)이 정한 바에 따라 보장을 합니다. 그러나 회사가 청약시에 제1회 보험료를 받고 청약을 승낙한 경우에는 제1회 보험료를 받은 때 (이 약관에서 제1회 보험료를 받은 날을「보장개시일(책임개시일)」이라 하며 보장개시일(책임개시일)을 계약일로 봅니다) 부터 이 특별약관이 정한 바에 따라 보장을 합니다.\n② 제1항에도 불구하고 보험계약일을 기준으로 피보험자(보험대상자)의 보험나이가 15세 이상인 경우 제4조(암, 상피내암, 기타피부암, 경계성 종양, 갑상샘암의 정의 및 진단확정) 제1항에서 정한 암(이하「암」이라 합니다)에 대한 회사의 보장은 제1항에서 정한 보장개시일(책임개시일)로부터 그날을 포함하여 90일이 지난날의 다음날(이하「암보장개시일(책임개시일)」 이라 합니다)에 시작합니다. 다만,「자동갱신 특별약관」에 따라 보장이 자동갱신되는 경우에는 이 특별약관의 갱신일로 합 니다.\n③ 회사가 청약시에 제1회 보험료를 받고 청약을 승낙하기 전에 보험금 지급사유가 발생하였을 때에도 제1회 보험료를 받은 때부터 이 특별약관이 정하는 바에 따라 보장을 합니다.\n④ 제3항의 규정에도 불구하고 회사는 다음 중 한 가지에 해당되는 경우에는 보장을 하지 아니합니다.\n① 무배당 메리츠 가족단위보험 M-Story1009 1종 보통약관(이하「보통약관」이라 합니다) 제25조(계약 전 알릴 의무)의 규정에 의하여 계약자 또는 피보험자(보험대상자)가 회사에 알린 내용 또는 건강진단 내용이 보험금 지급사유의 발생 에 영향을 미쳤음을 회사가 증명하는 경우\n② 보통약관 제27조(알릴 의무 위반의 효과)를 준용하여 회사가 보장을 하지 아니할 수 있는 경우\n③ 진단계약에서 보험금 지급사유 발생시까지 진단을 받지 아니한 경우\n【암보장개시일(책임개시일)[예시](단, 보험나이 15세 이상인 경우)】 계약일 보장개시일 90일 2010년 4월 10일 2010년 7월 9일","갱신형 질병입원의료비(A)":"① 회사는 피보험자(보험대상자)가 질병으로 인하여 병원에 입원하여 치료를 받은 경우에는 입원의료비를 다 음과 같이 하나의 질병당 보험가입금액(5,000만원을 최고한도로 계약자가 정하는 금액으로 합니다)을 한 도로 보상하여 드립니다. 구분 보상금액 입원실료, 입원제비용, 입원수술비 「국민건강보험법에서 정한 요양급여 또는 의료급여법에서 정한 의료급여 중 본인부담금」과「비급여(상급병실료 차액 제외)」부분의 합계액 중 90% 해당액 (다만, 10% 해당액이 계약일 또는 매년 계약해당일로부터 연간 200만원을 초과 하는 경우 그 초과금액은 보상합니다) 상급병실료차액 입원시 실제 사용병실과 기준병실과의 병실료 차액 중 50%를 공제한 후의 금액 (다만, 1일 평균금액 10만원을 한도로 하며, 1일 평균금액은 입원기간 동안 상 급병실료 차액 전체를 총 입원일수로 나누어 산출합니다)\n② 제1항의 질병에서 청약서상「계약 전 알릴 의무(중요한 사항에 한합니다)」에 해당하는 질병으로 인하여 과거(청약서상 당해 질병의 고지대상 기간을 말합니다)에 진단 또는 치료를 받은 경우에는 제외합니다.\n(3) 질병입원\n③ 피보험자(보험대상자)가 국민건강보험법 또는 의료급여법을 적용받지 못하는 경우(국민건강보험법 에서 정한 요양급여 또는 의료급여법에서 정한 의료급여 절차를 거치지 아니한 경우도 포함합니다.)에는 입원 의료비 중 본인이 실제로 부담한 금액의 40% 해당액을 하나의 질병당 보험가입금액(5,000만원을 최고한도 로 계약자가 정하는 금액으로 합니다)을 한도로 보상하여 드립니다.\n④ 회사는 동일한 질병 또는 하나의 질병(의학상 관련이 있다고 의사가 인정하는 질병은 동일한 질병으로 간 주하며, 동일한 질병으로 2회 이상 치료를 받는 경우에는 이를 하나의 질병으로 봅니다)으로 인한 입원의 료비는 최초 입원일로부터 365일(최초 입원일을 포함합니다)까지 보상하여 드립니다. 다만, 하나의 질병 으로 인하여 최초 입원일로부터 365일을 넘어 입원할 경우에는 아래의 예시와 같이 90일간의 보상제외기 간이 지나야 새로운 질병으로 인한 입원으로 보아 다시 보상하여 드립니다. <보상기간 예시> 보상대상기간\n(365일) ↑ 계약일\n(2010.4.1) ↑ 최초 입원일\n(2010.6.1) 보상제외\n(90일) ↑\n(2011.5.31) 2011.6.1.부터 보상제외 보상대상기간\n(365일) ↑\n(2011.8.29) 2011.8.30.부터 보상재개 ↑\n(2012.8.28) 2012.8.29.부터 보상제외\n⑤ 피보험자(보험대상자)가 입원하여 치료를 받던 중 보험기간이 만료되더라도 그 계속 중인 입원에 대하여 는 보험기간 종료일로부터 180일까지(보험기간 종료일은 제외합니다) 보상하여 드립니다. 다만, 이 경우 제4항은 적용하지 아니합니다.\n⑥ 피보험자(보험대상자)가 병원의 직원복리후생제도에 의하여 납부할 의료비를 감면받은 경우에는 그 감면 전 의료비를 기준으로 입원의료비를 계산합니다. 담보 종목 보상하는 사항\n⑦ 동일한 질병이란 발생 원인이 동일한 질병(의학상 중요한 관련이 있는 질병을 포함합니다)을 말하며, 질 병의 치료 중에 발생된 합병증 또는 새로이 발견된 질병의 치료가 병행되거나 의학상 관련이 없는 여러 종류의 질병을 갖고 있는 상태에서 입원한 때에는 동일한 질병으로 간주합니다.\n(3) 질병입원\n⑧ 제2항에도 불구하고 청약일 이전에 진단확정된 질병이라 하더라도 청약일 이후 5년이 지나는 동안(계약이 자동갱신되어 5년을 지나는 경우를 포함합니다) 그 질병으로 인하여 추가적인 진단(단순 건강검진 제외) 또는 치료사실이 없을 경우, 청약일로부터 5년이 지난 이후에는 이 특별약관에 따라 보상하여 드립니다.\n⑨ 제8항의「청약일 이후 5년이 지나는 동안」이라 함은 이 특별약관 제17조(보험료의 납입연체시 납입최고 (독촉)와 계약의 해지)에서 정한 계약의 해지가 발생하지 않은 경우를 말합니다.\n⑩ 이 특별약관 제18조(보험료의 납입연체로 인한 해지계약의 부활(효력회복))에서 정한 계약의 부활이 이루 어진 경우 부활일을 제8항의 청약일로 하여 적용합니다.","갱신형 질병통원의료비(A)":"① 회사는 피보험자(보험대상자)가 질병으로 인하여 병원에 통원하여 치료를 받거나 처방조제를 받은 경우에 는 통원의료비로서 매년 계약해당일로부터 1년을 단위로 하여 다음과 같이 외래(외래제비용, 외래수술비) 및 처방조제비를 각각 보상하여 드립니다.\n(4) 질병통원 구분 보 상 한 도 외래 방문 1회당「국민건강보험법에서 정한 요양급여 또는 의료급여법에서 정한 의료급 여 중 본인부담금」과「비급여」부분의 합계액에서 ＜표1 항목별 공제금액＞을 차 감하고 외래의 보험가입금액주)을 한도로 보상(매년 계약해당일로부터 1년간 방문 180회 한도) 처방 조제비 처방전 1건당「국민건강보험법에서 정한 요양급여 또는 의료급여법에서 정한 의료 급여 중 본인부담금」과「비급여」부분의 합계액에서 ＜표1 항목별 공제금액＞을 차감하고 처방조제비의 보험가입금액주)을 한도로 보상(매년 계약해당일로부터 1년 간 처방전 180건 한도)\n주) 외래 및 처방조제비는 회(건)당 합산하여 30만원을 최고한도로 계약자가 정하는 금액으로 합니다. ＜표1 항목별 공제금액＞ 구 분 항 목 의료법 제3조 제2항 제1호에 의한 의원, 치과의원, 한의원, 의료 법 제3조 제2항 제2호에 의한 조산원, 지역보건법 제7조에 의한 보건소, 지역보건법 제8조에 의한 보건의료원, 지역보건법 제10 외래 조에 의한 보건지소, 농어촌 등 보건의료를 위한 특별조치법 제 (외래제비용 및 15조에 의한 보건진료소 외래수술비 합계) 의료법 제3조 제2항 제3호에 의한 병원, 치과병원, 한방병원, 요 양병원, 종합병원 국민건강보험법 제40조 제2항에 의한 종합전문요양기관 또는 의 료법 제3조의 4에 의한 상급종합병원 국민건강보험법 제40조 제1항 제2호에 의한 약국, 동법 제40조 처방 제1항 제3호에 의한 한국희귀의약품센터에서의 처방, 조제(의사 조제비 의 처방전 1건당, 의약분업 예외지역에서 약사의 직접조제 1건당) 공제 금액 1만원 1만 5천원 2만원 8천원","골절(치아파절제외)진단비":"1-20. 골절(치아파절 제외)진단비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 골절(치아파절 제외)진단비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에 무배당 메리츠 가족단위보험 M-Story1009 1종 보통약관(이하「보통약관」이라 합니다) 제17조(보험금의 종류 및 지급사유) 제1호에서 정한 상해(이하「상해」라 합니다)를 입고 그 직접결과로써【별표2(골절(치아파절 제외)분류표)】에서 정하는 골 절로 진단확정시 보험수익자(보험금을 받는 자)에게 1사고당 이 특별약관의 보험가입금액을 골절(치아파절 제외)진단비로 지급합니다.","교통상해사망.후유장해":"1-5. 교통상해사망･후유장해보장 특별약관\n제1조(보험금의 종류 및 지급사유) 회사는 다음에 정한 운전자(자가용)형, 비운전자형 중에서 계약자가 선택한 한가지 형만을 보상하여 드립니다. 운전자(자가용)형 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)에 게 이 교통상해사망･후유장해보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에 다음 사항 중 어느 한 가지의 경우에 해당되는 사유가 발생한 때에는 보험수익자(보험금을 받는 자)에게 아래와 같이 약정 한 보험금을 지급합니다.\n① 만 15세 이상의 피보험자(보험대상자)가 보험기간 중에 교통상해(보험기간 중에 발생한 아래에 정한 사고로 신체(의수, 의족, 의안, 의치 등 신체보조장구는 제외하나, 인공장기나 부분 의치 등 신체에 이식되어 그 기능을 대신할 경우는 포함합니다)에 입은 상해를 말하며, 이하「교통상해」라 합니다)를 입고 그 직접결과로써 사망한 경우(질병으로 인한 사망은 제외합니다)에는 보험수익자(보험금을 받는 자)에게 이 특별약관의 보험가입금액 전액을 사망보험금으로 지급 합니다. ⑴ 피보험자(보험대상자)가 자동차를 운전하던 중에 급격하고도 우연한 자동차 사고 ⑵ 피보험자(보험대상자)가 운행중인 자동차에 운전을 하고 있지 않은 상태로 탑승중이거나 운행중인 기타 교통수단에 탑승(「운전」을 포함합니다. 이하 같습니다)하고 있는 동안 급격하고도 우연한 외래의 사고 ⑶ 피보험자(보험대상자)가 운행중인 자동차 및 기타 교통수단에 탑승하지 아니하고 있는 동안, 운행중인 자동차 및 기타 교통수단(적재물을 포함합니다)과의 충돌, 접촉 또는 이들 자동차 및 기타 교통수단의 충돌, 접촉, 화재 또는 폭발등의 교통사고\n② 보험기간 중에 교통상해로【별표1(장해분류표)】에서 정한 장해지급률이 80%이상에 해당하는 장해상태가 되었을 때에 는 보험수익자(보험금을 받는 자)에게 이 특별약관의 보험가입금액 전액을 고도후유장해보험금으로 지급합니다.\n③ 보험기간 중에 교통상해로【별표1(장해분류표)】에서 정한 각 장해지급률이 80%미만에 해당하는 장해상태가 되었을 때 에는 보험수익자(보험금을 받는 자)에게【별표1(장해분류표)】에서 정한 지급률을 이 특별약관의 보험가입금액에 곱하 여 산출한 금액을 일반후유장해보험금으로 지급합니다. 비운전자형 회사는 피보험자(보험대상자)에게 보험기간 중에 다음 사항 중 어느 한 가지의 경우에 해당되는 사유가 발생한 때에는 보험 수익자(보험금을 받는 자)에게 아래와 같이 약정한 보험금을 지급합니다.\n① 만 15세 이상의 피보험자(보험대상자)가 보험기간 중에 자동차 비운전중 교통상해(보험기간 중에 발생한 아래에 정한 사고로 신체(의수, 의족, 의안, 의치 등 신체보조장구는 제외하나, 인공장기나 부분 의치 등 신체에 이식되어 그 기능 을 대신할 경우는 포함합니다)에 입은 상해를 말하며, 이하「자동차 비운전중 교통상해」라 합니다)를 입고 그 직접결 과로써 사망한 경우(질병으로 인한 사망은 제외합니다)에는 보험수익자(보험금을 받는 자)에게 이 특별약관의 보험가 입금액 전액을 사망보험금으로 지급합니다. ⑴ 피보험자(보험대상자)가 운행중인 자동차에 운전을 하고 있지 않은 상태로 탑승중이거나 운행중인 기타 교통수단에 탑승(「운전」을 포함합니다. 이하 같습니다)하고 있는 동안 급격하고도 우연한 외래의 사고 ⑵ 피보험자(보험대상자)가 운행중인 자동차 및 기타 교통수단에 탑승하지 아니하고 있는 동안, 운행중인 자동차 및 기타 교통수단(적재물을 포함합니다)과의 충돌, 접촉 또는 이들 자동차 및 기타 교통수단의 충돌, 접촉, 화재 또는 폭발등의 교통사고\n② 보험기간 중에 자동차 비운전중 교통상해로【별표1(장해분류표)】에서 정한 장해지급률이 80%이상에 해당하는 장해상 태가 되었을 때에는 보험수익자(보험금을 받는 자)에게 이 특별약관의 보험가입금액 전액을 고도후유장해보험금으로 지급합니다.\n③ 보험기간 중에 자동차 비운전중 교통상해로【별표1(장해분류표)】에서 정한 각 장해지급률이 80%미만에 해당하는 장해 상태가 되었을 때에는 보험수익자(보험금을 받는 자)에게【별표1(장해분류표)】에서 정한 지급률을 이 특별약관의 보 험가입금액에 곱하여 산출한 금액을 일반후유장해보험금으로 지급합니다.\n…(이하 약관 원문 참조)","깁스치료비":"3-10. 깁스치료비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 깁스치료비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에 진단확정된 질 병 또는 무배당 메리츠 가족단위보험 M-Story1009 1종 보통약관(이하「보통약관」이라 합니다) 제17조(보험금의 종류 및 지 급사유) 제1호에서 정한 상해로 인하여「깁스(Cast)치료」를 받았을 때에는 보험수익자(보험금을 받는 자)에게 이 특별약관 의 보험가입금액을 깁스치료비로 지급합니다.","대중교통이용중교통상해사망후유장해":"1-7. 대중교통이용중 교통상해사망･후유장해보장 특별약관\n제1조(보험금의 종류 및 지급사유)\n① 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다) 에게 이 대중교통이용중 교통상해사망･후유장해보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」 이라 합니다) 중에 다음 사항 중 어느 한 가지의 경우에 해당되는 사유가 발생한 때에는 보험수익자(보험금을 받는 자)에게 아래와 같이 약정한 보험금을 지급합니다.\n① 만 15세 이상의 피보험자(보험대상자)가 보험기간 중에 승객으로서 대중교통이용중 교통상해(보험기간 중에 발생한 아 래에서 정한 급격하고도 우연한 외래의 사고로 신체(의수, 의족, 의안, 의치 등 신체보조장구는 제외하나, 인공장기나 부분 의치 등 신체에 이식되어 그 기능을 대신할 경우는 포함합니다)에 입은 상해를 말하며, 이하「대중교통이용중 교 통상해」라 합니다)를 입고 그 직접결과로써 사망한 경우(질병으로 인한 사망은 제외합니다)에는 보험수익자(보험금을 받는 자)에게 이 특별약관의 보험가입금액 전액을 사망보험금으로 지급합니다. ㉠ 운행중 대중교통수단에 피보험자(보험대상자)가 탑승중에 일어난 교통사고 ㉡ 대중교통수단에 피보험자(보험대상자)가 탑승목적으로 승․하차 하던중 일어난 교통사고 ㉢ 대중교통수단의 이용을 위해 피보험자(보험대상자)가 승강장내 대기중 일어난 교통사고\n② 보험기간 중에 승객으로서 대중교통이용중 교통상해로 【별표1(장해분류표)】에서 정한 장해지급률이 80%이상에 해당 하는 장해상태가 되었을 때에는 보험수익자(보험금을 받는 자)에게 이 특별약관의 보험가입금액 전액을 고도후유장해 보험금으로 지급합니다.\n③ 보험기간 중에 승객으로서 대중교통이용중 교통상해로 【별표1(장해분류표)】에서 정한 각 장해지급률이 80%미만에 해 당하는 장해상태가 되었을 때에는 보험수익자(보험금을 받는 자)에게【별표1(장해분류표)】에서 정한 지급률을 이 특 별약관의 보험가입금액에 곱하여 산출한 금액을 일반후유장해보험금으로 지급합니다.\n② 제1항의 대중교통이라 함은 이용을 원하는 모든 사람이 이용할 수 있는 다음의 교통수단을 말합니다.\n① 여객수송용 항공기\n② 여객수송용 지하철/전철, 기차\n③ 여객자동차운수사업법 시행령 제3조에서 규정한 시내버스, 농어촌버스, 마을버스, 시외버스 및 고속버스(전세버스 제 외)\n④ 여객자동차운수사업법 시행령 제3조에서 규정한 일반택시, 개인택시(렌트카 제외)","보험료자동납입특약":"보험료 자동납입 특별약관\n제1조(보험료 납입)\n① 보험계약자(이하「계약자」라 합니다)는 이 보험료 자동납입 특별약관(이하「특별약관」이라 합니다)에 따라 계약자의 거래은행(우체국을 포함합니다. 이하 같습니다) 지정계좌를 이용하여 보험료를 자동 납입합니다.\n② 제1항에 의하여 제1회 보험료의 납입방법을 계약자의 거래은행 지정계좌를 통한 자동납입으로 가입하고자 하는 경우에, 회사는 청약서를 접수하고 자동이체신청에 필요한 정보를 제공한 때(다만, 계약자의 귀책사유로 보험료 납입이 불가능한 경 우에는 거래은행의 지정계좌로부터 제1회 보험료가 이체된 날을 기준으로 합니다)를 청약일 및 제1회 보험료 납입일로 하여 보통약관의 제1조(계약의 성립)의 규정을 적용합니다.","상해흉터복원수술비":"1-29. 상해흉터복원수술비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 상해흉터복원수술비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에 무배당 메리츠 가족단위보험 M-Story1009 1종 보통약관(이하「보통약관」이라 합니다) 제17조(보험금의 종류 및 지급사유) 제1호에 서 정한 상해로 치료를 받고 그 직접적인 결과로 안면부, 상지, 하지에 외형상의 반흔이나 추상장해, 신체의 기형이나 기 능장해가 발생하여 그 원상회복을 목적으로 사고일로부터 2년 이내에 성형외과 전문의로부터 성형수술(단, 사고발생시점 만 15세 미만자의 경우 부득이 사고일로부터 2년 경과 후에 성형수술이 가능하다는 진단을 받은 경우에는 그 진단으로 대체할 수 있습니다)을 받은 경우에는 보험수익자(보험금을 받는 자)에게 아래에 정한 금액을 상해흉터복원수술비로 지급합니다. 구분 안면부 상지ㆍ하지 상해흉터복원수술비 수술 1Cm당 14만원 수술 1Cm당 7만원 (단, 3Cm이상의 경우에 한합니다.)\n주) 길이측정이 불가한 식피술등의 경우 수술Cm는 최장직경으로 합니다.\n【용어풀이】 안면부, 상지, 하지란 다음을 말합니다.\n1. 안면부란 이마를 포함하여 목까지의 얼굴부분을 말합니다.\n2. 상지란 견관절 이하의 팔부분을 말합니다.\n3. 하지란 고관절 이하 대퇴부, 하퇴부, 족부를 의미하며, 둔부, 서혜부, 복부 등은 제외합니다.","양성뇌종양진단비":"2-27. 양성뇌종양진단비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 양성뇌종양진단비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에「양성뇌 종양」으로 진단확정 되었을 때에는 보험수익자(보험금을 받는 자)에게 양성뇌종양진단비를 지급합니다.","이륜차운전중상해부보장":"이륜자동차 운전중 상해 부보장 특별약관\n제1조(계약의 체결 및 효력)\n① 이 이륜자동차 운전중 상해 부보장 특별약관(이하「특별약관」이라 합니다)은 보통약관(다른 특별약관이 부가된 경우에 는 그 특별약관도 포함합니다. 이하「보통약관」이라 합니다)을 체결할 때 보험계약자의 청약과 회사의 승낙으로 보통약관 에 부가하여 이루어집니다.\n② 보통약관이 해지, 기타사유에 의하여 효력을 가지지 아니하게 된 경우에는 이 특별약관도 더 이상 효력을 가지지 아니합 니다.\n③ 이 특별약관은 피보험자(보험대상자)가 이륜자동차를 소유, 사용(직업, 직무 또는 동호회 활동 등으로 주기적으로 운전 하는 경우에 한하며 일회적인 사용은 제외), 관리하는 경우에 한하여 부가하여 이루어집니다.","일반상해사망후유장해":"1-1. 일반상해사망･후유장해보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)에 게 이 일반상해사망･후유장해보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에 다음 사항 중 어느 한 가지의 경우에 해당되는 사유가 발생한 때에는 보험수익자(보험금을 받는 자)에게 아래와 같이 약정 한 보험금을 지급합니다.\n① 만 15세 이상의 피보험자(보험대상자)가 보험기간 중에 무배당 메리츠 가족단위보험 M-Story1009 1종 보통약관(이하 「보통약관」이라 합니다) 제17조(보험금의 종류 및 지급사유) 제1호에서 정한 상해(이하「상해」라 합니다)를 입고 그 직접결과로써 사망한 경우(질병으로 인한 사망은 제외합니다)에는 보험수익자(보험금을 받는 자)에게 이 특별약관 의 보험가입금액 전액을 사망보험금으로 지급합니다.\n② 보험기간 중 상해로【별표1(장해분류표)】에서 정한 장해지급률이 80%이상에 해당하는 장해상태가 되었을 때에는 보험 수익자(보험금을 받는 자)에게 이 특별약관의 보험가입금액 전액을 고도후유장해보험금으로 지급합니다.\n③ 보험기간 중 상해로【별표1(장해분류표)】에서 정한 각 장해지급률이 80%미만에 해당하는 장해상태가 되었을 때에는 보험수익자(보험금을 받는 자)에게 【별표1(장해분류표)】에서 정한 지급률을 이 특별약관의 보험가입금액에 곱하여 산출한 금액을 일반후유장해보험금으로 지급합니다.","일상생활중배상책임(II)":"5-1. 일상생활중배상책임(Ⅱ)보장 특별약관\n제1조(보상하는 손해) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(보험대상자) 본인 및 그와 동거하는 배우자 (이하「피보험자(보험대상자)」라 합니다)가 이 일상생활중배상책임(Ⅱ)보장 특별약관(이하「특별약관」이라 합니다)의 보 험기간(이하「보험기간」이라 합니다) 중 다음에 열거하는 사고(이하「사고」라 합니다)로 피해자에게 신체의 장해에 대한 법률상의 배상책임(이하 「대인 배상책임」이라 합니다) 또는 재물의 손해에 대한 법률상의 배상책임(이하 「대물 배상책 임」이라 합니다)을 부담함으로써 입은 손해(이하 「배상책임손해」라 합니다)를 이 특별약관에 따라 보상하여 드립니다.\n① 피보험자(보험대상자)가 주거용으로 사용하는 보험증권(보험가입증서)에 기재된 주택(부지내의 동산 및 부동산을 포함 합니다)의 소유, 사용, 관리로 인한 우연한 사고\n② 피보험자(보험대상자)의 일상생활(주택 이외의 부동산의 소유, 사용 및 관리는 제외합니다)로 인한 우연한 사고","조혈모세포이식수술비":"2-37. 조혈모세포이식수술비보장 특별약관\n제1조(보험금의 종류 및 지급사유) 우리회사(이하「회사」라 합니다)는 보험증권(보험가입증서)에 기재된 피보험자(이하「피보험자(보험대상자)」라 합니다)가 이 조혈모세포이식수술비보장 특별약관(이하「특별약관」이라 합니다)의 보험기간(이하「보험기간」이라 합니다) 중에「조 혈모세포이식」을 받은 경우에는 보험수익자(보험금을 받는 자)에게 최초 1회에 한하여 이 특별약관의 보험가입금액을 조혈 모세포이식수술비로 지급합니다.","질병사망":"2-1.       const head = sum ? `<div class="sit-head"><div class="l">${esc(sit.h)}</div><div class="v num">${won(sum)}</div><div class="n">${esc(sit.hn || '')}${sit.hn ? ' ' : ''}단순 합산한 예상 금액이에요.</div></div>` : '';
      return btns + `<div class="panel-title"><span>${esc(sit.k)}</span></div><div class="panel-caption">이 상황에서 받을 수 있는 보장을 보험사별로 모았어요. 실제 지급 여부와 금액은 약관, 진단 내용, 가입 후 경과 기간(감액 기간 등)에 따라 달라요.</div>${head}${groups || '<div class="empty">해당하는 보장이 없어요.</div>'}`;
    }

    const relTxt = n => { if (n <= 0) return '이번 달'; const y = Math.floor(n / 12), m = n % 12; return (y ? y + '년 ' : '') + (m ? m + '개월 ' : '') + '후'; };
    const mTxt = m => `${Math.floor(m / 12)}.${pad2(m % 12 + 1)}`;
    const manTxt = n => (Math.round(n / 1000) / 10).toLocaleString();
    const birthOf = pol => (D.people.find(x => x.id === pol.owner) || {}).birth;
    const ageOf = (pol, y) => { const b = birthOf(pol); return b ? ` · ${person(pol.owner).name} ${y - b}세` : ''; };
    function paidCnt(p) {
      const m = /^(\d{4})\.(\d+)\.(\d+)/.exec(p.period || ''); if (!m || !p.pay || !p.pay.end) return 0;
      const sy = +m[1], sm = +m[2], sd = +m[3], now = new Date(), [ey, em] = p.pay.end.split('.').map(Number), last = ey * 12 + em - 1;
      let n = 0; while (n < 1500 && sy * 12 + sm - 1 + n <= last && new Date(sy, sm - 1 + n, sd) <= now) n++;
      return n;
    }
    const isSil = i => /의료비/.test(i.rider + i.name);
    function renewParts(pol) {
      if (!pol.renewal) return { sil: 0, dx: 0 };
      const rn = pol.items.filter(i => /^갱신형/.test(i.rider)), sum = f => rn.filter(f).reduce((a, i) => a + (i.premium || 0), 0), pr = pol.premium || 0;
      const sil = Math.min(pr, sum(isSil)), dx = Math.min(pr - sil, sum(i => !isSil(i)));
      return { sil, dx };
    }
    function renderTl() {
      const now = new Date(), nowM = now.getFullYear() * 12 + now.getMonth(), ns = !!st.nosil;
      const pols = D.policies.filter(okPol).filter(paying);
      const rows = pols.filter(p => p.premium && p.pay && p.pay.end).map(p => {
        const [ey, em] = p.pay.end.split('.').map(Number), rp = renewParts(p);
        return { p, endM: ey * 12 + em - 1, sil: ns ? 0 : rp.sil, dx: rp.dx, pr: p.premium - (ns ? rp.sil : 0), silAll: rp.sil };
      }).filter(r => r.endM >= nowM);
      const skip = pols.filter(p => p.premium && !(p.pay && p.pay.end)).length;
      const tog = `<div class="scroll-row" style="padding:12px 0 0"><button type="button" class="range-tab ${ns ? 'active' : ''}" data-nosil="1">실손 제외하고 보기</button></div>`;
      if (!rows.length) return `<div class="panel-title"><span>월 보험료 타임라인</span></div>${tog}<div class="empty">납입 중인 계약이 없어요.</div>`;

      const bnd = [...new Set(rows.map(r => r.endM + 1))].sort((a, b) => a - b), pts = [nowM, ...bnd], totM = pts[pts.length - 1] - nowM;
      const sumBy = (arr, k) => arr.reduce((a, r) => a + r[k], 0);
      const segs = pts.slice(0, -1).map((b0, k) => {
        const act = rows.filter(r => r.endM >= b0), end = rows.filter(r => r.endM < b0 && (r.sil || r.dx));
        return { b0, b1: pts[k + 1], act, end, base: sumBy(act, 'pr'), cs: sumBy(end, 'sil'), cd: sumBy(end, 'dx') };
      });
      const maxV = Math.max(1, ...segs.map(g => g.base + g.cs + g.cd)), W = 340, H = 176, L = 6, R = 6, T = 22, B = 24, pw = W - L - R, ph = H - T - B;
      const X = m => L + (m - nowM) / totM * pw, Y = v => T + ph - v / maxV * ph;
      const pat = (id, c) => `<pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--surface1)"/><line x1="0" y1="0" x2="0" y2="5" style="stroke:${c};stroke-width:1.6"/></pattern>`;
      let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월 보험료 변화 그래프"><defs>${pat('tlh', 'var(--text3)')}${pat('tlg', 'var(--gold)')}</defs>`;
      const box = (x, w, v0, v1, st0) => `<rect x="${x.toFixed(1)}" y="${Y(v1).toFixed(1)}" width="${Math.max(w - 1, 0.5).toFixed(1)}" height="${(Y(v0) - Y(v1)).toFixed(1)}" style="${st0}"/>`;
      segs.forEach(g => {
        const x0 = X(g.b0), w = X(g.b1) - x0; let acc = 0;
        g.act.forEach(r => { svg += box(x0, w, acc, acc + r.pr, `fill:${insColor(r.p.insurer)}`); acc += r.pr; });
        if (g.cs) { svg += box(x0, w, acc, acc + g.cs, 'fill:url(#tlh);stroke:var(--text3);stroke-dasharray:3 2;stroke-width:1'); acc += g.cs; }
        if (g.cd) { svg += box(x0, w, acc, acc + g.cd, 'fill:url(#tlg);stroke:var(--gold);stroke-dasharray:3 2;stroke-width:1'); acc += g.cd; }
        const mt = manTxt(g.base); if (w >= mt.length * 6 + 4) svg += `<text class="tv" x="${(x0 + w / 2).toFixed(1)}" y="${(Y(acc) - 5).toFixed(1)}" text-anchor="middle" font-size="10.5">${mt}</text>`;
      });
      pts.forEach((m, k) => {
        const x = X(m), anc = k === 0 ? 'start' : k === pts.length - 1 ? 'end' : 'middle';
        svg += `<line x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${T + ph + 4}" style="stroke:var(--border-strong);stroke-dasharray:2 3"/><text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${anc}" font-size="10.5">${k === 0 ? '지금' : Math.floor(m / 12)}</text>`;
      });
      svg += '</svg>';
      const insList = [...new Set(rows.map(r => r.p.insurer))];
      const leg = `<div class="tl-leg">${insList.map(n => `<span><i class="idot" style="--ic:${insColor(n)}"></i>${esc(n)}</span>`).join('')}${segs.some(g => g.cs) ? '<span><i class="hz"></i>실손 계속 납입 가능분</span>' : ''}${segs.some(g => g.cd) ? '<span><i class="hz g"></i>진단비 갱신형 계속 납입 가능분</span>' : ''}</div>`;

      const nowSum = segs[0].base, left = rows.reduce((a, r) => a + r.pr * (r.endM - nowM + 1), 0), silNow = sumBy(rows, 'silAll');
      const sub0 = ns ? '실손 제외 기준' : (silNow ? `실손 약 ${silNow.toLocaleString()}원 포함` : '');
      const sum = `<div class="tl-sum"><div class="metric"><div class="label">지금 월 보험료</div><div class="value num">${nowSum.toLocaleString()}원</div>${sub0 ? `<div class="sub">${sub0}</div>` : ''}</div><div class="metric"><div class="label">남은 납입 총액</div><div class="value num">${won(left)}</div><div class="sub">납입 완료 예정일 기준${ns ? ' · 실손 제외' : ''}</div></div></div>`;

      const paidRows = D.policies.filter(okPol).filter(live).filter(p => p.premium && p.pay && p.pay.end && p.period).map(p => {
        const n = paidCnt(p), pr = p.premium - (ns ? renewParts(p).sil : 0); return { p, n, v: pr * n };
      }).filter(x => x.n);
      const noPay = [...new Set(D.policies.filter(okPol).filter(live).filter(p => p.premium && !(p.pay && p.pay.end)).map(p => p.insurer))];
      const paidTot = paidRows.reduce((a, x) => a + x.v, 0);
      const paidSum = paidRows.length ? `<div class="metric full"><div class="label">지금까지 낸 보험료</div><div class="value num">${won(paidTot)}</div><div class="sub">현재 월 보험료 × 납입 횟수로 추정${ns ? ' · 실손 제외' : ''}</div><div class="paid-rows">${paidRows.map((x, n) => `<div class="payl ${n ? '' : 'first'}"><span><i class="idot" style="--ic:${insColor(x.p.insurer)}"></i>${esc(x.p.insurer)} · ${x.n}회</span><b class="num">${won(x.v)}</b></div>`).join('')}</div></div>` : '';
      const paidList = '';

      const ev = pts.slice(1).map((m, k) => {
        const g = segs[k], nx = segs[k + 1], ended = rows.filter(r => r.endM + 1 === m), lastM = m - 1;
        const after = nx ? nx.base : 0, cs = nx ? nx.cs : g.cs + sumBy(ended, 'sil'), cd = nx ? nx.cd : g.cd + sumBy(ended, 'dx');
        const who = ended.map(r => `${esc(r.p.insurer)}${ageOf(r.p, Math.floor(lastM / 12))}`).join(', ');
        const first = ended.some(r => r.sil || r.dx);
        const parts = [cs ? `실손 ${cs.toLocaleString()}원` : '', cd ? `진단비 갱신형 ${cd.toLocaleString()}원` : ''].filter(Boolean).join(' + ');
        const note = (cs || cd) ? `<br><span class="cy">${parts}이 계속 나가면 월 ${(after + cs + cd).toLocaleString()}원${first ? ' (갱신형은 납입 완료 후에도 갱신 때마다 나갈 수 있어요)' : ''}</span>` : '';
        return `<div class="tl-ev"><div class="h"><span class="w">${mTxt(lastM)} 납입 완료 <b class="yl">${relTxt(lastM - nowM)}</b></span><span class="a num">${after.toLocaleString()}원<small style="font-size:12px;font-weight:400;color:var(--text3)">/월</small></span></div><div class="d">${who} · 납입 기준 월 <span class="dn num">${(g.base - after).toLocaleString()}원 줄어요</span>${note}</div></div>`;
      }).join('');

      const rnPols = D.policies.filter(okPol).filter(p => paying(p) && p.renewal);
      const rnRows = rnPols.map(p => {
        let t = curTerm(p.renewal), last = t.last, [y, mo, d] = t.end.split('.').map(Number), out = [];
        for (let k = 0; k < 3 && !last; k++) {
          out.push(`${t.end.split('.').slice(0, 2).join('.')}${ageOf(p, y)}`);
          const nxt = new Date(y + p.renewal.years, mo - 1, d); y = nxt.getFullYear();
          t = { end: fmtD(nxt) }; if (p.renewal.until) { const [uy, um, ud] = p.renewal.until.split('.').map(Number); if (nxt >= new Date(uy, um - 1, ud)) last = true; }
        }
        const rp = renewParts(p), sp = [rp.sil ? `실손 ${rp.sil.toLocaleString()}원` : '', rp.dx ? `진단비 ${rp.dx.toLocaleString()}원` : ''].filter(Boolean).join(' · ');
        return `<div class="payl"><span><i class="idot" style="--ic:${insColor(p.insurer)}"></i>${esc(p.insurer)} · ${p.renewal.years}년마다${sp ? `<br><small style="color:var(--text3)">${sp}</small>` : ''}</span><b class="num" style="text-align:right">${out.length ? out.join('<br>') : '마지막 구간'}</b></div>`;
      });
      const rnBlock = rnRows.length ? `<div class="tl-sec">다음 갱신 일정</div><div class="payb">${rnRows.map((r, n) => n ? r : r.replace('class="payl"', 'class="payl first"')).join('')}</div>` : '';

      return `<div class="panel-title"><span>월 보험료 타임라인</span></div><div class="panel-caption">납입 완료 예정일이 지날 때마다 월 보험료가 어떻게 줄어드는지 보여줘요. 오늘 날짜 기준으로 자동 계산돼요.</div>${tog}${sum.replace(/<\/div>$/, paidSum + '</div>')}${paidList}<div class="tl-chart"><div class="tl-unit">단위: 만원</div>${svg}${leg}</div><div class="tl-sec">변화 시점</div>${ev}${rnBlock}<div class="tl-sec">참고하세요</div><ul class="tl-notes"><li>갱신형 담보는 납입기간과 별개로 갱신 때마다 보험료를 계속 내는 구조가 일반적이에요. 이 계약도 그런지는 보험증서와 약관으로 확인하세요.</li><li>점선 영역은 갱신형 담보별 보험료 합계로 계산한 현재 기준 금액이에요. 실손은 '의료비' 담보이고, 갱신 때 오를 수 있어요.</li><li>'실손 제외하고 보기'는 실손을 해지하거나 바꾼다고 가정한 계산이에요.</li><li>지금까지 낸 보험료는 납입 시작일부터 오늘까지 낸 횟수에 현재 월 보험료를 곱한 값이에요. 갱신형 보험료가 달랐던 과거분은 실제와 다를 수 있어요.</li>${noPay.length ? `<li>납입 기간 정보가 없는 ${noPay.map(esc).join(', ')}은 제외했어요.</li>` : ''}${skip ? `<li>납입 완료 예정일이 없는 ${skip}건은 제외했어요.</li>` : ''}</ul>`;
    }
    function render() {
      renderStats(); renderDash();
      $('tg').style.display = $('sb').style.display = (st.v === 'sit' || st.v === 'tl') ? 'none' : '';
      $('out').innerHTML = st.v === 'cmp' ? renderCmp() : st.v === 'sit' ? renderSit() : st.v === 'tl' ? renderTl() : renderIns();
    }
    function all() { applyRenewals(); renderChips(); render(); }

    $('q').addEventListener('input', e => { st.q = e.target.value; render(); });
    document.body.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const d = b.dataset;
      if (d.sit) { st.sit = d.sit; render(); }
      else if (d.goSit) { st.v = 'sit'; st.sit = d.goSit; renderChips(); render(); $('out').scrollIntoView(); }
      else if (d.p) { st.p = d.p; renderChips(); render(); }
      else if (d.i) { st.i = d.i; renderChips(); render(); }
      else if (d.t) { st.t = d.t; renderChips(); render(); }
      else if (d.v) { st.v = d.v; renderChips(); render(); }
      else if (d.nosil) { st.nosil = !st.nosil; render(); }
      else if (d.pol) { flip.has(d.pol) ? flip.delete(d.pol) : flip.add(d.pol); render(); }
    });
    document.body.addEventListener('click', e => {
      const w = e.target.closest('.bk-amtw');
      document.querySelectorAll('.bk-amtw.open').forEach(x => { if (x !== w) { x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded', 'false'); } });
      if (w && e.target.closest('.bk-amt')) { const o = w.classList.toggle('open'); w.firstElementChild.setAttribute('aria-expanded', String(o)); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.bk-amtw.open').forEach(x => x.classList.remove('open')); });
    let light = false;
    try { const t = localStorage.getItem(TKEY); light = t === 'light'; } catch (e) { }
    const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
    const MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    function theme() { document.body.classList.toggle('light-theme', light); $('th').innerHTML = light ? MOON : SUN; $('th').setAttribute('aria-label', light ? '다크 모드로 전환' : '라이트 모드로 전환'); }
    $('th').onclick = () => { light = !light; theme(); try { localStorage.setItem(TKEY, light ? 'light' : 'dark'); } catch (e) { } };
    theme(); all();
    function setStk() { document.documentElement.style.setProperty('--stk', $('stk').offsetHeight + 'px'); }
    setStk();
    if (typeof window !== 'undefined') { window.addEventListener('resize', setStk); window.addEventListener('load', setStk); }
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(setStk).observe($('stk'));
      document.addEventListener('click', e => {
      const t = e.target.closest('.tx-btn');
      if (!t) return;
      const o = TXT[t.dataset.tx];
      if (o) openSheet(o.t, txHtml(o.l));
    });

    document.addEventListener('click', e => {
      const b = e.target.closest('[data-refund]');
      if (b) { const pol = REFUND[b.dataset.refund]; if (pol) openRefund(pol); return; }
      if (e.target.closest('.sheet-x') || e.target.id === 'rfBg') closeRefund();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRefund(); });

</script>
</body>
