<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>가스 계량기 기록</title>
<link rel="apple-touch-icon" href="gas-icon.png">
<link rel="icon" href="gas-icon.png">
<meta name="apple-mobile-web-app-title" content="가스 계량기">
<style>
:root{--ln:#3d4352;--hl:rgba(232,89,12,.09);--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--sub:#6b7280;--pri:#e8590c;--bd:#e5e7eb;--up:#d9480f;--down:#1971c2}
@media(prefers-color-scheme:dark){:root{--ln:#0f1216;--hl:rgba(255,138,91,.14);--bg:#14161a;--card:#1e2128;--tx:#e8eaed;--sub:#9aa0aa;--bd:#2d313a;--up:#ff8a5b;--down:#74b0f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR",sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:20px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=date]{display:block;line-height:24px}
input::-webkit-date-and-time-value{text-align:left}
input,select,textarea{width:100%;min-width:0;height:44px;-webkit-appearance:none;appearance:none;text-align:left;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;align-items:flex-start}.row>*{flex:1;min-width:0}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button.g{background:var(--bd);color:var(--tx)}
button.s{padding:5px 9px;font-size:12px}
.big{font-size:26px;font-weight:700;color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.grid div small{display:block;color:var(--sub);font-size:12px}
.grid div b{font-size:18px}
.item{border-top:1px solid var(--bd);padding:12px 0}
.l1{display:flex;align-items:center;gap:10px}
.l1 .d{font-weight:700;font-size:14px;min-width:42px}
.l1 .v{font-size:14px}
.l1 .df{margin-left:auto;text-align:right;white-space:nowrap}
.l1 .bt{display:flex;gap:12px;margin-left:6px}
button.lk{background:none;border:0;padding:2px 0;border-radius:0;color:var(--sub);font-size:13px;font-weight:400;text-decoration:underline;text-underline-offset:3px}
.l2{margin-top:6px;font-size:13px;color:var(--sub);line-height:1.7}
.item:first-child{border-top:0}
.item small{color:var(--sub)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
.up{color:var(--up)}.down{color:var(--down)}
#msg{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
details.mp{border-top:1px solid var(--bd)}
details.mp:first-of-type{border-top:0}
details.mp summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer}
details.mp summary::-webkit-details-marker{display:none}
details.mp summary::after{content:"›";font-size:20px;color:var(--sub);transition:transform .2s;margin-left:4px}
details.mp[open] summary::after{transform:rotate(90deg)}
.mp .ml{flex:1;min-width:0}.mp .ml b{display:block;font-size:15px}.mp .ml small{color:var(--sub);font-size:12px}
.mp .mr{text-align:right}.mp .mr b{display:block;font-size:15px}.mp .mr small{color:var(--sub);font-size:12px}
.mp .body{padding:16px 0 14px}
.mp .grid b{font-size:16px}
.mp .none{color:var(--sub)}
details.cd>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.cd>summary::-webkit-details-marker{display:none}
details.cd>summary h2{margin:0}
details.cd>summary::after{content:"›";font-size:22px;color:var(--sub);transition:transform .2s}
details.cd[open]>summary::after{transform:rotate(90deg)}
details.cd[open]>summary{margin-bottom:8px}
.item.in{padding:12px 0 12px 0}
details.mp>summary{margin:0 -10px;padding:12px 10px;border-left:3px solid transparent;border-radius:0}
details.mp[open]>summary{background:var(--hl);border-left-color:var(--pri)}
details.mp[open]{margin:0 -10px;padding:0 10px;border-bottom:2px solid var(--ln)}
.grid.g4{grid-template-columns:repeat(var(--cols,4),1fr);gap:6px}
.grid.g4 b{font-size:16px;white-space:nowrap}
.grid.g4 small{margin-bottom:2px;white-space:nowrap}
.note{display:flex;gap:4px;font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:4px}
.tsel{display:flex;gap:6px}.tsel select{padding:10px 6px;text-align:center;text-align-last:center}
.mp .ml b small.pr{display:inline;margin-left:6px;font-weight:400}
.th{position:relative;display:flex;align-items:center;gap:8px}
button.info{background:none;border:1.5px solid var(--sub);color:var(--sub);width:18px;height:18px;min-width:18px;padding:0;border-radius:50%;font-size:11px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.tip{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:20;background:#2b303b;color:#f3f4f6;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:400;line-height:1.5;white-space:pre-line;width:max-content;max-width:100%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tip.on{display:block}
</style>
</head>
<body>
<h1>가스 계량기 기록</h1>

<div class="card">
  <h2>오늘 기록</h2>
  <div class="row">
    <div><label>날짜</label><input type="date" id="date"></div>
    <div><label>계량기 수치 (㎥)</label><input type="number" id="reading" step="0.01" inputmode="decimal" placeholder="예: 1234.56"></div>
  </div>
  <div class="row">
    <div><label>평균기온 (℃) <span id="tAuto"></span></label><input type="number" id="temp" step="0.1" inputmode="decimal" placeholder="자동"></div>
    <div><label>최저 / 최고</label><input id="range" readonly placeholder="-"></div>
  </div>
  <label>난방</label>
  <select id="heat">
    <option value="">사용 안 함</option>
    <option>난방 ON (지속)</option>
    <option>외출 모드</option>
    <option>예약 운전</option>
    <option>온수만 사용</option>
  </select>
  <div class="row">
    <div><label>설정온도 (℃)</label><input type="number" id="setT" step="0.5" inputmode="decimal"></div>
    <div id="hoursBox"><label>총 난방시간</label><input id="hours" readonly placeholder="자동 계산"></div>
  </div>
  <div class="row" id="rowTime">
    <div><label>난방 시작</label><div class="tsel"><select id="hStartH"></select><select id="hStartM"></select></div><input type="hidden" id="hStart"></div>
    <div><label>난방 종료</label><div class="tsel"><select id="hEndH"></select><select id="hEndM"></select></div><input type="hidden" id="hEnd"></div>
  </div>
  <div class="row" id="rowSched" style="display:none">
    <div><label>반복 간격</label><select id="intvSel"></select></div>
    <div><label>1회 가동시간</label><select id="runSel"></select></div>
  </div>
  <label>메모</label>
  <input id="memo" placeholder="예: 저녁 6시~11시 거실만">
  <div class="row" style="margin-top:12px">
    <button id="save">저장</button>
    <button class="g" id="fetchT">기온 다시 불러오기</button>
  </div>
  <div id="msg"></div>
</div>

<div class="card">
  <h2 class="th">청구 기간 (18일 ~ 17일) <button type="button" class="info" id="infoBtn" aria-label="계산 기준 안내">!</button><div class="tip" id="tip"></div></h2>
  <select id="period"></select>
  <div id="psum" style="margin-top:12px"></div>
  <label style="margin-top:12px;margin-bottom:5px">청구 요금 (원) — 직접 입력</label>
  <input type="number" id="fee" inputmode="numeric" placeholder="예: 52300">
</div>

<details class="card cd"><summary><h2>월별 청구 내역</h2></summary><div id="monthly"></div></details>

<details class="card cd" open><summary><h2>일별 기록</h2></summary><div id="list"></div></details>

<details class="card cd"><summary><h2>GitHub 저장</h2></summary>
  <label>저장소 (아이디/저장소명)</label>
  <input id="ghRepo" placeholder="예: myid/gas-data" autocapitalize="off" autocorrect="off">
  <div class="row">
    <div><label>파일 경로</label><input id="ghPath" autocapitalize="off"></div>
    <div><label>브랜치</label><input id="ghBranch" autocapitalize="off"></div>
  </div>
  <label>토큰 (이 기기에만 저장)</label>
  <input type="password" id="ghToken" placeholder="github_pat_..." autocomplete="off">
  <div class="row" style="margin-top:12px">
    <button id="ghSave">연결 후 불러오기</button>
    <button class="g" id="ghNow">지금 저장</button>
  </div>
  <div id="gh" style="font-size:12px;color:var(--sub);margin-top:8px;min-height:16px"></div>
</details>

<details class="card cd"><summary><h2>설정 / 백업</h2></summary>
  <div class="row">
    <div><label>위도</label><input type="number" id="lat" step="0.0001"></div>
    <div><label>경도</label><input type="number" id="lon" step="0.0001"></div>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="g" id="geo">현재 위치 사용</button>
    <button class="g" id="exp">내보내기</button>
    <button class="g" id="imp">불러오기</button>
  </div>
  <input type="file" id="file" accept=".json" hidden>
</details>

<script>
const $=id=>document.getElementById(id);
const KEY='gasMeterV1';
let db={records:{},fees:{},loc:{lat:37.497,lon:126.861}};
try{const s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
const persistLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){$('msg').textContent='저장소 사용 불가 — 내보내기로 백업하세요'}};
const persist=()=>{persistLocal();schedulePush();if(typeof renderMonthly==='function')renderMonthly()};
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const num=v=>v===''||v==null?null:Number(v);
const r2=n=>Math.round(n*100)/100;

$('date').value=fmt(new Date());
if(db.loc.lat===37.5665){db.loc={lat:37.497,lon:126.861};persistLocal()}
$('lat').value=db.loc.lat;$('lon').value=db.loc.lon;

/* ----- 기온 ----- */
async function fetchTemp(date){
  const {lat,lon}=db.loc;
  const q=`latitude=${lat}&longitude=${lon}&daily=temperature_2m_mean,temperature_2m_min,temperature_2m_max&timezone=auto&start_date=${date}&end_date=${date}`;
  const urls=[`https://api.open-meteo.com/v1/forecast?${q}`,`https://archive-api.open-meteo.com/v1/archive?${q}`];
  for(const u of urls){
    try{
      const j=await (await fetch(u)).json();
      const d=j.daily;
      if(d&&d.temperature_2m_mean&&d.temperature_2m_mean[0]!=null)
        return{avg:r2(d.temperature_2m_mean[0]),min:d.temperature_2m_min[0],max:d.temperature_2m_max[0]};
    }catch(e){}
  }
  return null;
}
async function loadTemp(){
  $('tAuto').textContent='(조회중)';
  const t=await fetchTemp($('date').value);
  if(t){$('temp').value=t.avg;$('range').value=t.min+' / '+t.max;$('tAuto').textContent='(자동)';}
  else{$('tAuto').textContent='(실패)';$('range').value='';}
}

/* ----- 폼 ----- */
let formDirty=false;
function fillForm(){
  formDirty=false;
  const r=db.records[$('date').value];
  $('reading').value=r?r.reading:'';
  $('heat').value=r?r.heat||'':'';
  $('setT').value=r&&r.setT!=null?r.setT:'';
  setHours(r&&r.hours!=null?r.hours:null);
  $('hStart').value=r&&r.hStart?r.hStart:'';
  $('hEnd').value=r&&r.hEnd?r.hEnd:'';
  hiddenToSel('hStart');hiddenToSel('hEnd');
  setSel($('intvSel'),r&&r.intervalMin);setSel($('runSel'),r&&r.runMin);
  $('memo').value=r?r.memo||'':'';
  if(r&&r.temp!=null){$('temp').value=r.temp;$('range').value=r.min!=null?r.min+' / '+r.max:'';$('tAuto').textContent='';}
  else{$('temp').value='';loadTemp();}
  syncHeat();
}
function useT(){const v=$('heat').value;return !!v&&v!=='외출 모드'&&v!=='온수만 사용'}
function syncHeat(){
  const v=$('heat').value,off=!useT(),sched=v==='예약 운전';
  if(off||sched){setHours(null);$('hStart').value='';$('hEnd').value='';hiddenToSel('hStart');hiddenToSel('hEnd')}
  if(off){$('setT').value=''}
  if(off||!sched){$('intvSel').value='';$('runSel').value=''}
  $('rowTime').style.display=sched?'none':'';
  $('hoursBox').style.display=sched?'none':'';
  $('rowSched').style.display=sched?'':'none';
  $('setT').disabled=off;
  ['hStartH','hStartM','hEndH','hEndM'].forEach(id=>{$(id).disabled=off;$(id).style.opacity=off?.5:1});
  $('setT').style.opacity=off?.5:1;
}
$('heat').onchange=syncHeat;
function fmtH(h){const m=Math.round(h*60),hh=Math.floor(m/60),mm=m%60;return hh&&mm?`${hh}시간 ${mm}분`:hh?`${hh}시간`:`${mm}분`}
function setHours(h){$('hours').dataset.v=h==null?'':h;$('hours').value=h==null?'':fmtH(h)}
function getHours(){const v=$('hours').dataset.v;return v===undefined||v===''?null:Number(v)}
function calcHours(){
  const a=$('hStart').value,b=$('hEnd').value;
  if(!a||!b){setHours(null);return}
  const[ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);
  let d=(bh*60+bm)-(ah*60+am);if(d<0)d+=1440;
  setHours(d>0?d/60:null);
}
['hStartH','hEndH'].forEach(id=>{$(id).innerHTML='<option value="">시</option>'+Array.from({length:24},(_,i)=>`<option>${String(i).padStart(2,'0')}</option>`).join('')});
['hStartM','hEndM'].forEach(id=>{$(id).innerHTML='<option value="">분</option>'+[0,10,20,30,40,50].map(i=>`<option>${String(i).padStart(2,'0')}</option>`).join('')});
const mkOpts=(el,ph,arr)=>{el.innerHTML=`<option value="">${ph}</option>`+arr.map(m=>`<option value="${m}">${fmtH(m/60)}</option>`).join('')};
mkOpts($('intvSel'),'선택',Array.from({length:24},(_,i)=>(i+1)*30));
mkOpts($('runSel'),'선택',Array.from({length:18},(_,i)=>(i+1)*10));
function setSel(el,v){
  if(!v){el.value='';return}
  if(!Array.from(el.options).some(o=>o.value==v)){const o=document.createElement('option');o.value=v;o.textContent=fmtH(v/60);el.appendChild(o)}
  el.value=v;
}
function selToHidden(p){
  const h=$(p+'H').value,m=$(p+'M').value;
  $(p).value=(h!==''&&m!=='')?h+':'+m:'';
  calcHours();
}
function hiddenToSel(p){
  const v=$(p).value;
  if(!v){$(p+'H').value='';$(p+'M').value='';return}
  const[h,m]=v.split(':');
  $(p+'H').value=h;
  if(!Array.from($(p+'M').options).some(o=>o.value===m)){const o=document.createElement('option');o.textContent=m;$(p+'M').appendChild(o)}
  $(p+'M').value=m;
}
['hStart','hEnd'].forEach(p=>{
  [p+'H',p+'M'].forEach(id=>{
    $(id).addEventListener('focus',()=>{
      if(!$(p).value){ // 처음 누르면 12:00으로 세팅
        if($(p+'H').value==='')$(p+'H').value='12';
        if($(p+'M').value==='')$(p+'M').value='00';
        selToHidden(p);formDirty=true;
      }
    });
    $(id).addEventListener('change',()=>{selToHidden(p);formDirty=true});
  });
});
$('date').onchange=fillForm;
['reading','temp','heat','setT','memo','intvSel','runSel'].forEach(id=>{$(id).addEventListener('input',()=>{formDirty=true});$(id).addEventListener('change',()=>{formDirty=true})});
$('fetchT').onclick=loadTemp;
$('save').onclick=()=>{
  const date=$('date').value,reading=num($('reading').value);
  if(!date||reading==null){$('msg').textContent='날짜와 수치를 입력하세요';return}
  const [mn,mx]=$('range').value.split('/').map(s=>num(s.trim()));
  db.records[date]={reading,temp:num($('temp').value),min:mn??null,max:mx??null,heat:$('heat').value,setT:useT()?num($('setT').value):null,hours:useT()?getHours():null,hStart:useT()&&$('hStart').value||null,intervalMin:$('heat').value==='예약 운전'?num($('intvSel').value):null,runMin:$('heat').value==='예약 운전'?num($('runSel').value):null,hEnd:useT()&&$('hEnd').value||null,memo:$('memo').value.trim()};
  persist();formDirty=false;$('msg').textContent='저장됨 ✓';render();
};

/* ----- 기간 계산 ----- */
const sorted=()=>Object.keys(db.records).sort();
function migrateFees(){
  let ch=false;
  Object.keys(db.fees||{}).forEach(k=>{
    if(k.endsWith('-17')){const n=k.slice(0,-2)+'18';if(db.fees[n]==null)db.fees[n]=db.fees[k];delete db.fees[k];ch=true}
  });
  return ch;
}
migrateFees();
function periodOf(startStr){ // startStr: 해당 월 18일 ~ 다음 달 17일
  const s=new Date(startStr+'T00:00:00');
  const e=new Date(s.getFullYear(),s.getMonth()+1,17);
  return[fmt(s),fmt(e)];
}
function buildPeriods(){
  const keys=sorted();const today=new Date();
  let first=keys.length?new Date(keys[0]+'T00:00:00'):today;
  let y=first.getFullYear(),m=first.getMonth()+(first.getDate()<18?-1:0);
  const cur=today.getDate()<18?new Date(today.getFullYear(),today.getMonth()-1,18):new Date(today.getFullYear(),today.getMonth(),18);
  const opts=[];
  for(let d=new Date(y,m,18);d<=cur;d=new Date(d.getFullYear(),d.getMonth()+1,18))opts.push(fmt(d));
  const sel=$('period'),prev=sel.value;
  sel.innerHTML=opts.reverse().map(s=>{const[a,b]=periodOf(s);return`<option value="${s}">${Number(a.slice(5,7))}월\u2060(${a.replace(/-/g,'.')}~${(a.slice(0,4)===b.slice(0,4)?b.slice(5):b).replace(/-/g,'.')})</option>`}).join('');
  sel.value=prev&&opts.includes(prev)?prev:opts[0];
}
function renderPeriod(){
  const s=$('period').value;
  const sub='(기간 시작 전 마지막 기록부터 계산해요)';
  if(!s){$('psum').innerHTML='<small>기록이 없습니다</small>';setTip('※기록이 없습니다\n'+sub);return}
  const p=pCalc(s);
  $('fee').value=db.fees[s]??'';
  if(p.use==null){
    $('psum').innerHTML='<small>계산할 기록이 부족합니다</small>';
    setTip('※기록이 부족해요\n'+sub);
    $('fee').oninput=()=>{const v=num($('fee').value);if(v==null)delete db.fees[s];else db.fees[s]=v;persist()};
    return;
  }
  setTip(`※${p.base.slice(5)} ~ ${p.last.slice(5)} 기록 기준\n`+sub);
  $('psum').innerHTML=`<div class="grid g4">
    <div><small>기간 사용량</small><b>${p.use} ㎥</b></div>
    <div><small>일평균</small><b>${p.days?r2(p.use/p.days):'-'} ㎥</b></div>
    <div><small>난방 기록일</small><b>${p.heat}일</b></div>
    <div id="unitBox"><small>1㎥당 요금</small><b id="unit">-</b></div></div>`;
  calcUnit(p.use);
  $('fee').oninput=()=>{const v=num($('fee').value);if(v==null)delete db.fees[s];else db.fees[s]=v;persist();calcUnit(p.use)};
}
function setTip(t){$('tip').textContent=t}
$('infoBtn').onclick=e=>{e.stopPropagation();$('tip').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#tip'))$('tip').classList.remove('on')});
function calcUnit(use){
  const v=num($('fee').value);
  if(!$('unit'))return;
  const ok=!!(v&&use>0);
  $('unit').textContent=ok?Math.round(v/use).toLocaleString()+'원':'-';
  $('unitBox').style.display=ok?'':'none';
  $('unitBox').parentElement.style.setProperty('--cols',ok?4:3);
}
$('period').onchange=renderPeriod;

/* ----- 목록 ----- */
const openD=new Set();let openDInit=false;
const pStart=k=>{const d=new Date(k+'T00:00:00');return fmt(d.getDate()>=18?new Date(d.getFullYear(),d.getMonth(),18):new Date(d.getFullYear(),d.getMonth()-1,18))};
function itemHtml(k,ks){
  const i=ks.indexOf(k),r=db.records[k];
  let diff='<small>-</small>',gapTxt='';
  if(i>0){
    const p=ks[i-1],gap=Math.round((new Date(k)-new Date(p))/864e5);
    const d=r2(r.reading-db.records[p].reading);
    diff=`<b class="${d>0?'up':'down'}">${d>0?'+':''}${d} ㎥</b>`;
    if(gap>1)gapTxt=`<span class="tag">${gap}일간</span>`;
  }
  const tags=gapTxt+(r.heat?`<span class="tag">${r.heat}</span>`:'')+(r.setT!=null?`<span class="tag">${r.setT}℃ 설정</span>`:'')+(r.intervalMin&&r.runMin?`<span class="tag">${fmtH(r.intervalMin/60)}마다 ${fmtH(r.runMin/60)}</span>`:'')+(r.hours!=null?`<span class="tag">${r.hStart&&r.hEnd?r.hStart+'~'+r.hEnd+' · ':''}${fmtH(r.hours)}</span>`:'');
  const info=[(r.temp!=null?r.temp+'℃'+(r.min!=null?` (${r.min}/${r.max})`:''):''),r.memo?r.memo.replace(/</g,'&lt;'):''].filter(Boolean).join(' · ');
  return`<div class="item"><div class="l1"><span class="d">${k.slice(5)}</span><span class="v">${r.reading} ㎥</span><span class="df">${diff}</span><span class="bt"><button class="lk" onclick="edit('${k}')">수정</button><button class="lk" onclick="del('${k}')">삭제</button></span></div>
  ${(tags||info)?`<div class="l2">${tags}${info}</div>`:''}</div>`;
}
function renderList(){
  const ks=sorted();
  if(!ks.length){$('list').innerHTML='<small>아직 기록이 없습니다</small>';return}
  const g={};ks.forEach(k=>{const st=pStart(k);(g[st]=g[st]||[]).push(k)});
  const starts=Object.keys(g).sort().reverse();
  if(!openDInit){openD.add(starts[0]);openDInit=true}
  $('list').innerHTML=starts.map(st=>{
    const[a,b]=periodOf(st);const p=pStats(st);
    const mon=Number(a.slice(5,7))+'월';
    const rng=a.replace(/-/g,'.')+' ~ '+(a.slice(0,4)===b.slice(0,4)?b.slice(5):b).replace(/-/g,'.');
    const items=g[st].slice().reverse().map(k=>itemHtml(k,ks)).join('');
    return`<details class="mp" data-p="${st}"${openD.has(st)?' open':''}><summary>
      <div class="ml"><b>${mon}<small class="pr">(${rng})</small></b><small>${g[st].length}일 기록</small></div>
      <div class="mr"><b>${p.use!=null?p.use+' ㎥':'-'}</b><small>기간 사용량</small></div></summary>
      <div class="body">${items}</div></details>`;
  }).join('');
  $('list').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{d.open?openD.add(d.dataset.p):openD.delete(d.dataset.p)}));
}
window.edit=k=>{$('date').value=k;fillForm();scrollTo({top:0,behavior:'smooth'})};
window.del=k=>{if(confirm(k+' 기록을 삭제할까요?')){delete db.records[k];persist();render()}};

function render(){buildPeriods();renderPeriod();renderList();renderMonthly()}
/* ----- 월별 청구 아코디언 ----- */
const openP=new Set();
function pCalc(st){
  const[a,b]=periodOf(st);
  const all=sorted();
  const ks=all.filter(k=>k>=a&&k<=b);
  const prev=all.filter(k=>k<a).pop();
  const base=prev||ks[0],last=ks[ks.length-1];
  if(!ks.length||!base||base===last)return{a,b,n:ks.length};
  const use=r2(db.records[last].reading-db.records[base].reading);
  const days=Math.round((new Date(last)-new Date(base))/864e5);
  const t=ks.map(k=>db.records[k].temp).filter(v=>v!=null);
  return{a,b,n:ks.length,base,last,use,days,avgT:t.length?r2(t.reduce((x,y)=>x+y,0)/t.length):null,heat:ks.filter(k=>db.records[k].heat).length};
}
const pStats=pCalc;
function renderMonthly(){
  const box=$('monthly');if(!box)return;
  const ps=Array.from($('period').options).map(o=>o.value);
  if(!ps.length){box.innerHTML='<small class="none">기록이 없습니다</small>';return}
  box.innerHTML=ps.map(st=>{
    const p=pStats(st),fee=db.fees[st];
    const label=p.a.slice(5).replace('-','/')+' ~ '+p.b.slice(5).replace('-','/');
    const unit=(fee&&p.use>0)?Math.round(fee/p.use).toLocaleString()+'원/㎥':'';
    const feeTxt=fee?Number(fee).toLocaleString()+'원':'<span class="none">요금 미입력</span>';
    const sub=p.use!=null?p.use+' ㎥ 사용':'기록 부족';
    const body=p.use!=null?`<div class="grid">
      <div><small>사용량</small><b>${p.use} ㎥</b></div>
      <div><small>일평균</small><b>${p.days?r2(p.use/p.days):'-'} ㎥</b></div>
      <div><small>평균기온</small><b>${p.avgT!=null?p.avgT+' ℃':'-'}</b></div>
      <div><small>난방 기록일</small><b>${p.heat}일</b></div>
      <div><small>청구 요금</small><b>${fee?Number(fee).toLocaleString()+'원':'-'}</b></div>
      <div><small>㎥당 요금</small><b>${unit||'-'}</b></div></div>
      <small style="color:var(--sub)">${p.base.slice(5)} ~ ${p.last.slice(5)} 기록 기준 · 기간 내 ${p.n}개</small>`
      :`<small class="none">계산할 기록이 부족해요 (기간 내 ${p.n}개)</small>`;
    return`<details class="mp" data-p="${st}"${openP.has(st)?' open':''}><summary>
      <div class="ml"><b>${label}</b><small>${sub}</small></div>
      <div class="mr"><b>${feeTxt}</b><small>${unit}</small></div></summary>
      <div class="body">${body}<div style="margin-top:10px"><button class="g s" onclick="selP('${st}')">이 기간 요금 입력/수정</button></div></div></details>`;
  }).join('');
  box.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{d.open?openP.add(d.dataset.p):openP.delete(d.dataset.p)}));
}
window.selP=st=>{$('period').value=st;renderPeriod();$('period').scrollIntoView({behavior:'smooth',block:'center'})};


/* ----- 설정 ----- */
$('lat').onchange=$('lon').onchange=()=>{db.loc={lat:num($('lat').value),lon:num($('lon').value)};persist()};
$('geo').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
  db.loc={lat:r2(p.coords.latitude),lon:r2(p.coords.longitude)};$('lat').value=db.loc.lat;$('lon').value=db.loc.lon;persist();loadTemp();
},()=>alert('위치 권한이 필요합니다'));
$('exp').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download='gas-meter-'+fmt(new Date())+'.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{db=Object.assign(db,JSON.parse(rd.result));persist();render();fillForm();alert('불러오기 완료')}catch(x){alert('파일 형식 오류')}};
  rd.readAsText(f);
};

/* ----- GitHub 동기화 ----- */
const GK='gasGhV1';
let gh={repo:'',path:'gas-data.json',branch:'main',token:''};
try{Object.assign(gh,JSON.parse(localStorage.getItem(GK)||'{}'))}catch(e){}
let ghSha=null,pushTimer=null;
const ghOn=()=>!!(gh.repo&&gh.token);
const apiUrl=()=>`https://api.github.com/repos/${gh.repo}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`;
const hd=()=>({Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'});
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\n/g,''))));
const setSt=t=>{$('gh').textContent=t};
const nowT=()=>new Date().toLocaleTimeString('ko-KR');
$('ghRepo').value=gh.repo;$('ghPath').value=gh.path;$('ghBranch').value=gh.branch;$('ghToken').value=gh.token;

async function ghPull(){
  if(!ghOn())return;
  setSt('불러오는 중…');
  try{
    const r=await fetch(apiUrl()+'?ref='+encodeURIComponent(gh.branch)+'&t='+Date.now(),{headers:hd()});
    if(r.status===404){ghSha=null;setSt('저장소에 파일이 없어요 — 저장하면 자동 생성돼요');if(Object.keys(db.records).length)await ghPush();return}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();ghSha=j.sha;
    if(db.pending){setSt('저장 안 된 변경분을 올리는 중…');await ghPush();return}
    const d=JSON.parse(b64d(j.content));
    db.records=d.records||{};db.fees=d.fees||{};if(d.loc)db.loc=d.loc;
    if(migrateFees())schedulePush();
    persistLocal();render();if(!formDirty)fillForm();$('lat').value=db.loc.lat;$('lon').value=db.loc.lon;
    setSt('불러오기 완료 ✓ '+nowT());
  }catch(e){setSt('불러오기 실패 ('+e.message+') — 저장소/토큰/브랜치 확인')}
}
async function ghPush(retry=true){
  if(!ghOn())return;
  setSt('저장 중…');
  try{
    const body={message:'gas data '+fmt(new Date()),content:b64e(JSON.stringify({records:db.records,fees:db.fees,loc:db.loc},null,1)),branch:gh.branch};
    if(ghSha)body.sha=ghSha;
    const r=await fetch(apiUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd()),body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&retry){
      const g=await fetch(apiUrl()+'?ref='+encodeURIComponent(gh.branch)+'&t='+Date.now(),{headers:hd()});
      ghSha=g.ok?(await g.json()).sha:null;
      return ghPush(false);
    }
    if(!r.ok)throw new Error(r.status);
    ghSha=(await r.json()).content.sha;db.pending=false;persistLocal();
    setSt('GitHub 저장 완료 ✓ '+nowT());
  }catch(e){setSt('저장 실패 ('+e.message+') — 다시 시도하려면 "지금 저장"')}
}
function schedulePush(){if(!ghOn())return;db.pending=true;persistLocal();clearTimeout(pushTimer);setSt('저장 대기…');pushTimer=setTimeout(()=>ghPush(),1500)}
$('ghSave').onclick=()=>{
  gh={repo:$('ghRepo').value.trim(),path:$('ghPath').value.trim()||'gas-data.json',branch:$('ghBranch').value.trim()||'main',token:$('ghToken').value.trim()};
  try{localStorage.setItem(GK,JSON.stringify(gh))}catch(e){}
  if(!ghOn()){setSt('저장소와 토큰을 입력하세요');return}
  ghSha=null;ghPull();
};
$('ghNow').onclick=()=>{clearTimeout(pushTimer);ghPush()};

render();fillForm();ghPull();
</script>
</body>
</html>
